name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Tests Status
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache pinned verification tools
        id: cache-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rookery-tools
          key: ${{ runner.os }}-${{ runner.arch }}-rookery-tools-${{ hashFiles('scripts/checks/install-verification-tools.sh') }}

      - name: Install pinned verification tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/checks/install-verification-tools.sh

      - name: Add cached verification tools to PATH
        if: steps.cache-tools.outputs.cache-hit == 'true'
        shell: bash
        run: echo "$RUNNER_TEMP/rookery-tools" >> "$GITHUB_PATH"

      - name: Validate Lefthook configuration
        run: lefthook validate

      - name: Run shared verification group
        run: lefthook run pre-push --force --no-tty
