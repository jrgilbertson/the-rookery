name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Tests Status
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned verification tools
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/rookery-tools"
          mkdir -p "$tool_dir"
          curl_args=(-fsSL --retry 2 --retry-all-errors --connect-timeout 10 --max-time 60)

          curl "${curl_args[@]}" -o "$RUNNER_TEMP/lefthook.gz" https://github.com/evilmartians/lefthook/releases/download/v2.1.10/lefthook_2.1.10_Linux_x86_64.gz
          echo "0b14162a0bb2f0c64ae0759f6102f6e19c4d00981666a8ac73d4f5a6878ada4f  $RUNNER_TEMP/lefthook.gz" | sha256sum --check
          gzip -dc "$RUNNER_TEMP/lefthook.gz" > "$tool_dir/lefthook"

          curl "${curl_args[@]}" -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$tool_dir" actionlint

          curl "${curl_args[@]}" -o "$RUNNER_TEMP/shellcheck.tar.xz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" "$tool_dir/shellcheck"

          curl "${curl_args[@]}" -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$tool_dir" gitleaks

          chmod +x "$tool_dir/lefthook" "$tool_dir/actionlint" "$tool_dir/shellcheck" "$tool_dir/gitleaks"
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Install policy parser
        run: python3 -m pip install --user 'pyyaml==6.0.3'

      - name: Validate Lefthook configuration
        run: lefthook validate

      - name: Run shared verification group
        run: lefthook run pre-push --force --no-tty
