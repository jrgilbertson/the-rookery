name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Tests Status
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned verification tools
        shell: bash
        run: bash scripts/checks/install-verification-tools.sh

      - name: Install policy parser
        run: python3 -m pip install --user 'pyyaml==6.0.3'

      - name: Validate Lefthook configuration
        run: lefthook validate

      - name: Run shared verification group
        run: lefthook run pre-push --force --no-tty
