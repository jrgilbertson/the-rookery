<svg xmlns="http://www.w3.org/2000/svg" text-rendering="geometricPrecision" viewBox="0 0 1664 936" width="1664" height="936" role="img">
  <title>How a Team lead coordinates work</title>
  <desc>Three small rooks launch paper boats. Huginn, the Team lead, lets routine boats drift on to the pond and shuts one flagged boat in a lock beside a bell, held for the operator.</desc>
  <image href="coordinating-work-artwork.webp" width="1664" height="936"/>
  <text x="333" y="508" font-family="Baskerville,Georgia,serif" font-weight="600" font-size="30" fill="#042458" text-anchor="middle">Workers</text>
  <text x="850" y="152" font-family="Baskerville,Georgia,serif" font-weight="600" font-size="30" fill="#042458" text-anchor="middle">Team lead</text>
  <text x="1196" y="296" font-family="Baskerville,Georgia,serif" font-weight="600" font-size="30" fill="#042458" text-anchor="middle">Held for</text>
  <text x="1196" y="330" font-family="Baskerville,Georgia,serif" font-weight="600" font-size="30" fill="#042458" text-anchor="middle">the operator</text>
  <text x="1150" y="892" font-family="Baskerville,Georgia,serif" font-weight="600" font-size="30" fill="#042458" text-anchor="middle">Routine work merges</text>
</svg>
