<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="testing-flow-title testing-flow-desc" id="testing-flow-root">
<title id="testing-flow-title">How work is checked</title>
<desc id="testing-flow-desc">Five delivery steps run in order along one route through a complete-flow verification gate, failed flows and failed checks return to the agent's work, and a separate orange track carries what the run taught to the start of the next run.</desc>
<defs>
      <style>#testing-flow-root { color: #042458; font-family: Baskerville,Georgia,serif; }
      #testing-flow-root text { font-family:Baskerville,Georgia,serif;fill:#042458 }
      #testing-flow-root .title { font-family:Didot,'Bodoni MT',Georgia,serif;font-size:40px }
      #testing-flow-root .node { font-size:18px;font-weight:600 }
      #testing-flow-root .sub { font-size:14px;fill:#47577A }
      #testing-flow-root .step-number { font-size:14px;font-weight:600;fill:#0050CC }
      #testing-flow-root .label { font-size:13px;font-weight:600;letter-spacing:.04em }</style>
<marker id="testing-flow-testing-flow-blue" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
<polygon points="0 0,12 5,0 10" fill="#0050CC"/>
</marker>
<marker id="testing-flow-testing-flow-signal" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
<polygon points="0 0,12 5,0 10" fill="#DC6C36"/>
</marker>
</defs>
<rect width="1280" height="720" fill="#F6F7FA"/><rect x=".5" y=".5" width="1279" height="719" fill="none" stroke="#47577A" stroke-opacity=".32"/>
<text x="48" y="64" class="title">How work is checked</text>
<text x="48" y="96" class="sub">Give agents room to work and check the result before delivery.</text>

<!-- Forward delivery spine: steps 01 to 05 in order -->
<path d="M 162 296 L 374 296" fill="none" stroke="#0050CC" stroke-width="3" marker-end="url(#testing-flow-testing-flow-blue)"/>
<path d="M 410 296 L 528 296" fill="none" stroke="#0050CC" stroke-width="3" marker-end="url(#testing-flow-testing-flow-blue)"/>
<path d="M 752 296 L 870 296" fill="none" stroke="#0050CC" stroke-width="3" marker-end="url(#testing-flow-testing-flow-blue)"/>
<path d="M 906 296 L 1118 296" fill="none" stroke="#0050CC" stroke-width="3" marker-end="url(#testing-flow-testing-flow-blue)"/>

<!-- Rework loops: a failure returns to the agent's work -->
<path d="M 640 344 L 640 380 Q 640 388 632 388 L 408 388 Q 400 388 400 380 L 400 313" fill="none" stroke="#0050CC" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#testing-flow-testing-flow-blue)"/>
<rect x="408" y="360" width="112" height="20" fill="#F6F7FA"/>
<text x="464" y="375" class="label" text-anchor="middle">FAILED FLOW</text>
<path d="M 888 314 L 888 424 Q 888 432 880 432 L 392 432 Q 384 432 384 424 L 384 313" fill="none" stroke="#0050CC" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#testing-flow-testing-flow-blue)"/>
<rect x="704" y="404" width="120" height="20" fill="#F6F7FA"/>
<text x="764" y="419" class="label" text-anchor="middle">FAILED CHECK</text>

<!-- Cross-run feedback track: what the run taught returns to the next run -->
<path d="M 1136 314 L 1136 520 Q 1136 528 1128 528 L 658 528" fill="none" stroke="#DC6C36" stroke-width="2" stroke-dasharray="12 4 2 4" marker-end="url(#testing-flow-testing-flow-signal)"/>
<path d="M 622 528 L 152 528 Q 144 528 144 520 L 144 315" fill="none" stroke="#DC6C36" stroke-width="2" stroke-dasharray="12 4 2 4" marker-end="url(#testing-flow-testing-flow-signal)"/>
<rect x="156" y="412" width="88" height="20" fill="#F6F7FA"/>
<text x="160" y="427" class="label">NEXT RUN</text>

<!-- Step 03: the verification gate the route passes through -->
<rect x="528" y="144" width="224" height="200" rx="2" fill="#F6F7FA" stroke="#042458" stroke-width="3"/>
<rect x="535.5" y="151.5" width="209" height="185" rx="2" fill="none" stroke="#0050CC" stroke-width="1"/>
<path d="M 536 296 L 618 296 M 662 296 L 744 296" fill="none" stroke="#0050CC" stroke-width="3"/>
<circle cx="640" cy="296" r="22" fill="#F6F7FA" stroke="#042458" stroke-width="3"/>
<circle cx="640" cy="296" r="17" fill="none" stroke="#0050CC" stroke-width="1"/>
<text x="640" y="301" class="step-number" text-anchor="middle">03</text>
<text x="640" y="188" class="node" text-anchor="middle">Verify the</text>
<text x="640" y="210" class="node" text-anchor="middle">complete flow</text>
<text x="640" y="236" class="sub" text-anchor="middle">Test the complete task</text>
<text x="640" y="254" class="sub" text-anchor="middle">or real operation</text>

<!-- Step 01 -->
<circle cx="144" cy="296" r="18" fill="#F6F7FA" stroke="#042458" stroke-width="1.5"/>
<text x="144" y="301" class="step-number" text-anchor="middle">01</text>
<text x="144" y="188" class="node" text-anchor="middle">Define outcome</text>
<text x="144" y="210" class="node" text-anchor="middle">and boundaries</text>
<text x="144" y="236" class="sub" text-anchor="middle">Set the goal, allowed</text>
<text x="144" y="254" class="sub" text-anchor="middle">actions and approvals</text>

<!-- Step 02 -->
<circle cx="392" cy="296" r="18" fill="#F6F7FA" stroke="#042458" stroke-width="1.5"/>
<text x="392" y="301" class="step-number" text-anchor="middle">02</text>
<text x="392" y="210" class="node" text-anchor="middle">Let the agent work</text>
<text x="392" y="236" class="sub" text-anchor="middle">Choose an approach and</text>
<text x="392" y="254" class="sub" text-anchor="middle">check work as you go</text>

<!-- Step 04 -->
<circle cx="888" cy="296" r="18" fill="#F6F7FA" stroke="#042458" stroke-width="1.5"/>
<text x="888" y="301" class="step-number" text-anchor="middle">04</text>
<text x="888" y="188" class="node" text-anchor="middle">Enforce</text>
<text x="888" y="210" class="node" text-anchor="middle">independent checks</text>
<text x="888" y="236" class="sub" text-anchor="middle">Pass required CI checks</text>
<text x="888" y="254" class="sub" text-anchor="middle">and approvals</text>

<!-- Step 05 -->
<circle cx="1136" cy="296" r="18" fill="#F6F7FA" stroke="#042458" stroke-width="1.5"/>
<text x="1136" y="301" class="step-number" text-anchor="middle">05</text>
<text x="1136" y="210" class="node" text-anchor="middle">Deliver verified work</text>
<text x="1136" y="236" class="sub" text-anchor="middle">Check the version that</text>
<text x="1136" y="254" class="sub" text-anchor="middle">will reach users</text>

<!-- Step 06: off the delivery spine, on the feedback track -->
<circle cx="640" cy="528" r="18" fill="#F0EBE5" stroke="#DC6C36" stroke-width="2"/>
<text x="640" y="533" class="step-number" text-anchor="middle">06</text>
<text x="640" y="578" class="node" text-anchor="middle">Learn from the run</text>
<text x="640" y="602" class="sub" text-anchor="middle">Review failures and improve the next run</text>

<!-- Legend -->
<path d="M48 656 H1232" stroke="#47577A" stroke-opacity=".3"/>
<path d="M 48 680 L 88 680" fill="none" stroke="#0050CC" stroke-width="3"/>
<text x="100" y="685" class="sub">Solid cobalt → work progresses</text>
<path d="M 400 680 L 440 680" fill="none" stroke="#0050CC" stroke-width="2" stroke-dasharray="5 4"/>
<text x="452" y="685" class="sub">Dashed cobalt → repair</text>
<path d="M 704 680 L 744 680" fill="none" stroke="#DC6C36" stroke-width="2" stroke-dasharray="12 4 2 4"/>
<text x="756" y="685" class="sub">Orange → improve the next run</text>
</svg>
