<?xml version="1.0" encoding="UTF-8"?>
<svg class="" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="testing-flow-title testing-flow-desc" id="testing-flow-root"><title id="testing-flow-title">How work is checked</title><desc id="testing-flow-desc">Six responsibilities connect agent freedom to verified delivery, with failures returning to the work and session learning improving future runs.</desc><defs>
      <style>#testing-flow-root { color: #042458; font-family: Baskerville,Georgia,serif; }
      #testing-flow-root nav { display:flex;gap:24px;padding:20px 0;border-block:1px solid #596A8B }
      #testing-flow-root a { color:#0050CC }
      #testing-flow-root .diagram-container { width:100%;overflow-x:auto;min-width:0 }
      #testing-flow-root.axonometric { min-width:1000px }
      #testing-flow-root text { font-family:Baskerville,Georgia,serif;fill:#042458 }
      #testing-flow-root .title { font-family:Didot,'Bodoni MT',Georgia,serif;font-size:40px }
      #testing-flow-root .node { font-size:16px;font-weight:600 }
      #testing-flow-root .sub { font-size:12px;fill:#596A8B }
      #testing-flow-root .step-number { font-size:12px;fill:#0050CC }
      #testing-flow-root .group { font-size:14px;font-weight:600;fill:#0050CC }
      #testing-flow-root .label { font-size:12px;font-weight:600 }
      #testing-flow-root .diagram-container { overflow:visible }
      #testing-flow-root.axonometric { min-width:0 }</style><marker id="testing-flow-testing-flow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#0050CC"/></marker><marker id="testing-flow-testing-flow-signal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#AD4C24"/></marker><marker id="testing-flow-testing-flow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#596A8B"/></marker></defs><rect width="1280" height="720" fill="#DEE2EC"/><text x="48" y="64" class="title" >How work is checked</text><text x="48" y="96" class="sub" >Give agents room to work and check the result before delivery.</text><path d="M 384 240 L 480 240" fill="none" stroke="#0050CC" stroke-width="2" marker-end="url(#testing-flow-testing-flow-blue)"/><path d="M 800 240 L 896 240" fill="none" stroke="#0050CC" stroke-width="2" marker-end="url(#testing-flow-testing-flow-blue)"/><path d="M 1056 296 L 1056 432" fill="none" stroke="#0050CC" stroke-width="2" marker-end="url(#testing-flow-testing-flow-blue)"/><path d="M 896 488 L 800 488" fill="none" stroke="#0050CC" stroke-width="2" marker-end="url(#testing-flow-testing-flow-blue)"/><path d="M 480 488 L 384 488" fill="none" stroke="#0050CC" stroke-width="2" marker-end="url(#testing-flow-testing-flow-blue)"/><path d="M 1008 184 L 1008 152 Q 1008 144 1000 144 L 632 144 Q 624 144 624 152 L 624 184" fill="none" stroke="#0050CC" stroke-width="2" marker-end="url(#testing-flow-testing-flow-blue)" stroke-dasharray="5 4"/><rect x="752" y="120" width="128" height="16" fill="#DEE2EC"/><text x="816.0" y="132" class="label" text-anchor="middle">FAILED FLOW</text><path d="M 896 456 L 856 456 Q 848 456 848 448 L 848 344 Q 848 336 840 336 L 680 336 Q 672 336 672 328 L 672 296" fill="none" stroke="#0050CC" stroke-width="2" marker-end="url(#testing-flow-testing-flow-blue)" stroke-dasharray="5 4"/><rect x="684" y="344" width="144" height="16" fill="#DEE2EC"/><text x="756.0" y="356" class="label" text-anchor="middle">FAILED CHECK</text><path d="M 160 544 L 160 604 Q 160 612 152 612 L 48 612 Q 40 612 40 604 L 40 272 Q 40 264 48 264 L 64 264" fill="none" stroke="#AD4C24" stroke-width="2" marker-end="url(#testing-flow-testing-flow-signal)" stroke-dasharray="5 4"/><rect x="48" y="348" width="144" height="16" fill="#DEE2EC"/><text x="120.0" y="360" class="label" text-anchor="middle">NEXT RUN</text><rect x="64" y="184" width="320" height="112" rx="6" fill="#DEE2EC" stroke="#042458" stroke-width="1"/><text x="80" y="208" class="step-number" >01</text><text x="80" y="236" class="node" >Define outcome and boundaries</text><text x="80" y="272" class="sub" >Set the goal, allowed actions and approvals</text><rect x="480" y="184" width="320" height="112" rx="6" fill="#DEE2EC" stroke="#042458" stroke-width="1"/><text x="496" y="208" class="step-number" >02</text><text x="496" y="236" class="node" >Let the agent work</text><text x="496" y="272" class="sub" >Choose an approach and check work as you go</text><rect x="896" y="184" width="320" height="112" rx="6" fill="#F0EBE5" stroke="#AD4C24" stroke-width="2"/><text x="912" y="208" class="step-number" >03</text><text x="912" y="236" class="node" >Verify the complete flow</text><text x="912" y="272" class="sub" >Test the complete task or real operation</text><rect x="896" y="432" width="320" height="112" rx="6" fill="#DEE2EC" stroke="#042458" stroke-width="1"/><text x="912" y="456" class="step-number" >04</text><text x="912" y="484" class="node" >Enforce independent checks</text><text x="912" y="520" class="sub" >Pass required CI checks and approvals</text><rect x="480" y="432" width="320" height="112" rx="6" fill="#DEE2EC" stroke="#042458" stroke-width="1"/><text x="496" y="456" class="step-number" >05</text><text x="496" y="484" class="node" >Deliver verified work</text><text x="496" y="520" class="sub" >Check the version that will reach users</text><rect x="64" y="432" width="320" height="112" rx="6" fill="#DEE2EC" stroke="#042458" stroke-width="1"/><text x="80" y="456" class="step-number" >06</text><text x="80" y="484" class="node" >Learn from the run</text><text x="80" y="520" class="sub" >Review failures and improve the next run</text><path d="M48 656 H1232" stroke="#596A8B" stroke-opacity=".3"/><text x="48" y="684" class="sub" >Solid cobalt → work progresses     ·     Dashed cobalt → repair     ·     Orange → improve the next run</text></svg>
