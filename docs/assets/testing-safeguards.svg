<svg class="axonometric" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" role="img" aria-labelledby="testing-safeguards-title testing-safeguards-desc" id="testing-safeguards-root"><title id="testing-safeguards-title">The environment beneath the work</title><desc id="testing-safeguards-desc">Five separable safeguards support agent judgment: permissions restrict actions, checks verify work, and scoped rules, skills and prose guide behavior.</desc>
