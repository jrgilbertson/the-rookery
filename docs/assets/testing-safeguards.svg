      #testing-safeguards-root text { font-family:Baskerville,Georgia,serif;fill:#042458 }
      #testing-safeguards-root .title { font-family:Didot,'Bodoni MT',Georgia,serif;font-size:40px }
      #testing-safeguards-root .node { font-size:16px;font-weight:600 }
      #testing-safeguards-root .sub { font-size:12px;fill:#596A8B }
      #testing-safeguards-root .step-number { font-size:12px;fill:#0050CC }
      #testing-safeguards-root .group { font-size:14px;font-weight:600;fill:#0050CC }
      #testing-safeguards-root .label { font-size:12px;font-weight:600 }
      #testing-safeguards-root .diagram-container { overflow:visible }
      #testing-safeguards-root.axonometric { min-width:0 }</style>
