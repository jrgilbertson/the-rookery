<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="704" viewBox="0 0 1600 704" role="img" aria-labelledby="the-rookery-workflows-banner-title the-rookery-workflows-banner-desc">
  <title id="the-rookery-workflows-banner-title">The workflows</title>
  <desc id="the-rookery-workflows-banner-desc">Research, Plan, Design, Build and Ship move work forward; Maintain improves the working system and Learn brings questions back to Research.</desc>
  <defs>
    <clipPath id="the-rookery-workflows-banner-header-paper">
      <rect width="1600" height="70" />
    </clipPath>
  </defs>
  <rect width="1600" height="704" fill="#E3E9F7" />
  <image width="1600" height="667" href="the-rookery-workflows-banner-artwork.webp" aria-hidden="true" y="64" />
  <image width="1600" height="667" y="-4" href="the-rookery-workflows-banner-artwork.webp" clip-path="url(#the-rookery-workflows-banner-header-paper)" aria-hidden="true" />
  <text x="48" y="110" fill="#042458" font-family="Didot, Georgia, serif" font-size="96">The workflows</text>
  <text x="51" y="178" fill="#0050CC" font-family="Baskerville, Georgia, serif" font-size="22" font-weight="600" text-anchor="start">Research to shipped work, with lessons feeding back into the next run.</text>
  <text x="391" y="258" fill="#042458" font-family="Baskerville, Georgia, serif" font-size="26" font-weight="600" text-anchor="middle">1  Research</text>
  <text x="576" y="258" fill="#042458" font-family="Baskerville, Georgia, serif" font-size="26" font-weight="600" text-anchor="middle">2  Plan</text>
  <text x="764" y="258" fill="#042458" font-family="Baskerville, Georgia, serif" font-size="26" font-weight="600" text-anchor="middle">3  Design</text>
  <text x="935" y="258" fill="#042458" font-family="Baskerville, Georgia, serif" font-size="26" font-weight="600" text-anchor="middle">4  Build</text>
  <text x="1094" y="258" fill="#042458" font-family="Baskerville, Georgia, serif" font-size="26" font-weight="600" text-anchor="middle">5  Ship</text>
  <text x="1010" y="608" fill="#0050CC" font-family="Baskerville, Georgia, serif" font-size="26" font-weight="600" text-anchor="middle">Maintain</text>
  <text x="490" y="681" fill="#AD4C24" font-family="Baskerville, Georgia, serif" font-size="26" font-weight="600" text-anchor="middle">Learn</text>
</svg>
