  <path d="M700 528H665" fill="none" stroke="#0050CC" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#the-rookery-workflows-banner-blue)" />
  <path d="M700 582H665" fill="none" stroke="#DC6C36" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#the-rookery-workflows-banner-orange)" />
