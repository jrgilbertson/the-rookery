<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title description" text-rendering="geometricPrecision">
  <title id="title">The workflows</title>
  <desc id="description">Research through Ship form the Delivery Sequence. Maintain returns repository memory and Learn returns a better question.</desc>
  <image width="1600" height="640" xlink:href="the-rookery-workflows-banner-artwork.webp"/>

  <g fill="#042458">
    <text x="55" y="130" font-family="Didot, 'Bodoni 72', serif" font-size="112">The workflows</text>
  </g>

  <g fill="#1768b8" font-family="Baskerville, serif" font-weight="600">
    <text x="58" y="169" font-size="24">A five-job delivery sequence with two distinct feedback currents.</text>
  </g>

  <g font-family="Baskerville, serif" font-weight="600">
    <g fill="#1768b8" stroke="#1768b8" stroke-width="1.6">
      <circle cx="326" cy="216" r="13" fill="none"/>
      <circle cx="528" cy="216" r="13" fill="none"/>
      <circle cx="748" cy="216" r="13" fill="none"/>
      <circle cx="973" cy="216" r="13" fill="none"/>
      <circle cx="1203" cy="216" r="13" fill="none"/>
    </g>
    <g fill="#1768b8" font-size="18" text-anchor="middle">
      <text x="326" y="222">1</text>
      <text x="528" y="222">2</text>
      <text x="748" y="222">3</text>
      <text x="973" y="222">4</text>
      <text x="1203" y="222">5</text>
    </g>
    <g fill="#042458" font-size="22">
      <text x="349" y="223">Research</text>
      <text x="551" y="223">Plan</text>
      <text x="771" y="223">Design</text>
      <text x="996" y="223">Build</text>
      <text x="1226" y="223">Ship</text>
    </g>
    <text x="783" y="424" fill="#1768b8" font-size="22" text-anchor="middle">Maintain</text>
    <text x="783" y="499" fill="#d87817" font-size="22" text-anchor="middle">Learn</text>
  </g>
</svg>
