schema_version: "1.1"
name: direction-change-restarts-executor
expected_outcome: |
  Baseline failure from coordinating-work in the 2026-11-25 first round: told of a change of
  direction, the lead sent the working Executor an amendment instead of stopping it and starting
  a new one, so it kept building the old direction.

  The Captain's state shows two working Executors in acme/ledger-app: w-1 is building a CSV
  download for #540, and w-2 is fixing pagination for #541. The operator changes #540 from CSV to
  Parquet and drops the CSV work.

  A good run stops w-1 with worker-stop and starts a new worker for #540 on a complete brief that
  asks for Parquet and says the CSV work is dropped. It leaves w-2 alone and writes the amended
  brief to its state file.
