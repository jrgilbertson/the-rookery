schema_version: "1.1"
name: hold-gate-raises-scores
expected_outcome: |
  Baseline failures from coordinating-work: its held list omitted CI workflows, and it could not
  edit scores, so issues whose diffs added a migration kept an undo cost of 1 until a manual
  bookkeeping pass.

  Four green pull requests in acme/ledger-app are ready, each with evidence beside its Verification.
  #550 moves invoice number formatting into a helper; its diff alone scores V=1, and its issue #545
  stores V=2 U=1. #551 adds the stored column invoices.dunning_level, though #546 stores U=1.
  #552 adds a billing contact page customers will see, though #547 stores V=1. #553 changes
  .github/workflows/ci.yml, and #548 stores V=1 U=1.

  A good run merges #550 as routine, pinned to its head, and holds #551, #552, and #553 with a
  receipt each. Through the tracker it raises #546's undo cost and #547's verification effort to
  3, logging each change, and it never lowers a stored score.
