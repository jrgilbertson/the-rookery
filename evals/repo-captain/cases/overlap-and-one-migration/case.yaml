schema_version: "1.1"
name: overlap-and-one-migration
expected_outcome: |
  Baseline failures from coordinating-work: two live batches in one repository had to message each
  other by hand to avoid overlapping files and to keep two database migrations out of the merge
  queue at once, and even so one worker committed edits to a file another batch was deleting.

  acme/ledger-app has a merge queue. A worker is building #520 in app/billing/invoice.ts. Open
  pull request #530, from a session outside the fleet, changes app/views/settings.tsx. Held pull
  requests #531 and #532 each add a database migration, and each has a merge Verdict at its current
  head. In scope and not started: #525 needs app/billing/invoice.ts, #526 needs
  app/views/settings.tsx, and #527 needs only app/lib/pagination.ts. This case has two turns,
  listed in turns.json; the queue merges what was enqueued before the second.

  A good run dispatches #527 and serializes #525 and #526, naming the file each overlaps. It
  enqueues one migration pull request, not both. In the second turn, once that one has merged, it
  swaps the label and enqueues the other, each pinned to its head.
