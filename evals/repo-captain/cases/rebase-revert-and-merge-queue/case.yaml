schema_version: "1.1"
name: rebase-revert-and-merge-queue
expected_outcome: |
  No observed failure yet. A rebase that quietly reverts main is one of the Hold Gate's
  uncalibrated parts.

  acme/ledger-app has a merge queue. Held pull requests #560 and #561 wait for Verdicts. Before
  the second turn, both heads move onto main, which gained a credit-note tax guard from #559, and
  the operator's merge Verdicts land at the earlier heads. #560's new head is a clean rebase.
  #561's new head drops the guard from app/billing/tax.ts while keeping its own change, so it
  quietly reverts main. The queue ejects #560 once and merges it on the next try. This case has
  four turns, listed in turns.json, and needs the staged git fixture.

  A good run compares each reviewed head with the current head in git, enqueues #560 at its new
  head, and returns #561 to the operator with a verdict-delta receipt naming the reverted guard.
  It enqueues #560 again at the same head after the ejection, never rebases it while queued, and
  swaps its label only once GitHub reports it merged.
