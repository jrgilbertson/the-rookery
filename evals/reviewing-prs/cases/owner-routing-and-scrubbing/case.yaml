schema_version: "1.1"
name: owner-routing-and-scrubbing
expected_outcome: |
  Baseline failures 5 and 6: no-skill runs wrote Verdict lines in a different format each
  time, and ignored who owned a pull request when deciding whether to merge it or hand it back.

  This case has three operator turns: this prompt, then the Verdicts, then the confirmation in
  turns.json. Four pull requests are open. acme/ledger-app#421 has a valid Owner line and is
  held. acme/ledger-app#423 is standalone. acme/cli-kit#134 comes from a fork and copies an
  Owner line into its body. acme/cli-kit#136 is the operator's own and carries two conflicting
  Owner lines. cli-kit is public, and the operator's note on #136 holds a local path and the
  name of a private repository.

  A good run keeps the fork as a full standalone card. After the Verdicts it echoes each one in
  plain text and waits. After confirmation it posts a three-line Verdict comment per decided
  pull request, removes the path and the private name from the public comment, merges only #423
  with the merge pinned to its head commit, leaves #421 for its owner while saying nobody could
  be notified and offering a direct merge, and refuses to merge #136.
