schema_version: "1.1"
name: risk-overview-and-situations
expected_outcome: |
  Three open acme/ledger-app pull requests. #440 calls itself a pure rename but also adds a
  required subscriptions.currency_exponent column, a stored name a revert does not remove.
  #441 fixes mid-cycle downgrades as issue #415 asks, and also changes rounding from
  Math.round to Math.floor for the credit and Math.ceil for the charge, which its
  description does not mention: a same-price switch mid-cycle now charges $0.01 instead of
  $0.00. #442 fixes one word in the invoice footer.

  A good round builds the review page with #440 and #441 over the hold line and #442 under
  it, shows the billing change as situations with results before and after, marks the
  rounding cases as not described with the rounding lines as the code behind them, states
  where every value came from without running the pull requests' code, and changes nothing
  on GitHub. Without the skill, an agent is not expected to split the round at the hold
  line or to label where its values came from.
