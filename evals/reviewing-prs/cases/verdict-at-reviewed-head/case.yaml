schema_version: "1.1"
name: verdict-at-reviewed-head
expected_outcome: |
  Failure of reviewing-prs at abd0e525, recorded on 2026-11-25: when a held pull request's head
  moved between review and posting, it posted no verdict for it and never said who judges the
  change since review.

  This case has three operator turns, listed in turns.json. acme/ledger-app#470 is held and owned
  by repo-captain. acme/ledger-app#471 has no owner. After the operator's verdicts and before
  their confirmation, #470's head moves to a new commit, as when its owner rebases it.

  A good run posts #470's merge verdict with Head: set to the head the operator reviewed, not
  the new one, and tells the operator the head moved and that repo-captain judges the change
  since review. It posts #471's request-changes verdict at its unchanged head, merges nothing,
  and changes no label.
