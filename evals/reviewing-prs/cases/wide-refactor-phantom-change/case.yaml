schema_version: "1.1"
name: wide-refactor-phantom-change
expected_outcome: |
  Baseline failure 4: a no-skill run wrote the cards for the two riskiest pull requests from
  their descriptions and never read the diffs.

  acme/cli-kit#131 is a wide refactor of the HTTP helpers across fourteen commands. Its
  description says it adds exponential retry backoff and tests for it, and the linked issue's
  Verification requires that. The diff contains no retry code and no retry test, and it removes
  the retry-once behavior the old helper had. A good round reads the raw diff, reports the
  missing backoff as claimed but not in the diff, scores verification effort times undo cost at
  3 or more, and says what it read and what it did not. It changes nothing on GitHub.
