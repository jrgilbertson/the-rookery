min_version: 2.1.10
# leftover run grades the tree; it must not install git hooks as a side effect.
no_auto_install: true

pre-push:
  parallel: true
  commands:
    catalog:
      run: bash scripts/checks/catalog.sh
    repository-integrity:
      run: bash scripts/checks/lint.sh
    current-tree-secrets:
      run: gitleaks dir --redact --no-banner --no-color .
    fixtures:
      run: bash scripts/checks/fixtures.sh
