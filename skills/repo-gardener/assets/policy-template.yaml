# Copy to `.agents/repo-gardener.yaml` on the default branch.
scope:
  # Globs an Executor may change. A path must match at least one.
  include: ["**"]
  # Globs that win over include and keep a path out of every unit.
  exclude: []
# Globs an Executor never writes. The policy file is always protected.
protected_paths:
  - .agents/repo-gardener.yaml
  - .github/workflows/**
# Parallel Executor cap. 0 means sense and report only.
maximum_workers: 3
# Each item is one process argv run from the repository root.
scans: []
# Example: - ["npm", "run", "knip"]
# Argv lists an Executor may run to verify its unit, from the worktree root.
# Empty means no unit is dispatched; copy the commands CI already runs.
verify: []
# Example: - ["npm", "test"]
# GitHub issue number that receives one report comment per run.
# report_issue: 1
