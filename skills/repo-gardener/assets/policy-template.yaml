# Repo Gardener policy. Copy to `.agents/repo-gardener.yaml` on the default
# branch. Everything not listed under protected_paths may change, except
# authentication, payments, migrations, and secrets, which a run only recommends.
# Paths a gardener pull request never edits.
protected_paths:
  - .agents/repo-gardener.yaml
  - .github/workflows/**
# Pull requests one run may open. One Executor per pull request. 0 means
# sense and report only.
max_pull_requests: 10
# Nightly whole-project checks, read-only, one process argv each, run from
# the repository root. Findings become candidate work. Not merge-gate CI.
scans: []
# Example: - ["npm", "run", "knip"]
# Commands an Executor must pass before it asks for PR readiness, run from
# its worktree root. Use the smallest gating subset CI runs on pull
# requests; never a watch-mode command. Empty means no pull request opens.
verify: []
# Example: - ["npm", "test"]
# GitHub issue number that receives one morning report comment per run.
# report_issue: 1
