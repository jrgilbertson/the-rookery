# Repo Gardener durable file (starter)
#
# This asset is a fail-closed starter, not live authority. A run never loads it
# as the repository's policy. Copying it to `.agents/repo-gardener.yaml` is not
# adoption. Interactive setup writes the live file after one owner review.
# Until that live file exists, is valid, and names a live tracker identity, the
# skill does not open a managed run.
#
# Exact strings matter. Placeholders, `maximum_workers: 0`, and denied
# authoring-lane mutation keep this copy invalid or closed. Replace every
# REPLACE_WITH_* value with a real one during setup.
#
# Skill-hardcoded, not file knobs: never merge, release, deploy, create
# follow-up issues, or message customers; `.agents/repo-gardener.yaml` is
# always protected; presentation cap is 7; there is no depth quota in this
# file. Triage is recommend-only and is not grantable.
#
# Optional evidence-source grants are omitted here. If present they are a
# mapping at `evidence_sources.<name>.identity`. Absence is valid.

repository:
  # Stable provider identity for this repository, not the slug. On GitHub this
  # is the repo node id (for example `R_kgDO…` from `gh api repos/OWNER/NAME
  # --jq .node_id`).
  identity: REPLACE_WITH_STABLE_REPOSITORY_IDENTITY

  # Branch the run refreshes and reads this file from. Do not infer `main`.
  default_branch: REPLACE_WITH_DEFAULT_BRANCH

  # Paths a Worker may change. Repository-relative globs, no `..`. Exclude
  # wins: a path must match at least one include and no exclude.
  scope:
    include:
      - "**"
    exclude: []

# Extra globs a Worker must not write. The live `.agents/repo-gardener.yaml`
# is always protected even if omitted here; setup cannot turn that off.
protected_paths:
  - REPLACE_WITH_PROTECTED_PATH

# Parallel Worker cap. `0` denies Worker dispatch. Setup proposes `20`.
maximum_workers: 0

# Optional overlap exception for accumulating files. Add repository-relative
# paths only after the repository has proved conflict-safe additive merge
# behavior and each Worker diff is checked for its own additive entry. These
# paths relax assignment-conflict detection only; they never authorize an
# Orchestrator ledger write or automatic merge/rebase conflict resolution.
# shared_ledger_paths:
#   - REPLACE_WITH_REPOSITORY_RELATIVE_LEDGER_PATH

tracker:
  # Live gardening-tracker issue identity. #3336 is not a live tracker.
  identity: REPLACE_WITH_TRACKER_IDENTITY

# Eight authoring lanes plus recommend-only triage. An authoring grant allows
# a Worker PR only when the other live-file grants also pass. Triage has no
# mutation key.
lanes:
  # Manifests, advisories, and dependency-update PRs.
  dependency-and-vulnerability:
    mutation: false
    audit_commands: []
  # Ready, unblocked implementation issues in the issue source.
  issue-implementation:
    mutation: false
  # Failing checks and tests on current revisions.
  ci-and-failing-test:
    mutation: false
  # Tests, dead code, architecture, and a rotating source-slice inspection.
  repository-test-and-code-health:
    mutation: false
    audit_commands: []
  # Docs and changelog drift against shipped behavior. Not a release.
  documentation-changelog-and-release-note:
    mutation: false
    audit_commands: []
  # Configured errors or alerts, if a read source exists.
  runtime-error-and-alert:
    mutation: false
  # Risk-scoped QA and regression evidence.
  risk-scoped-qa-and-regression:
    mutation: false
    audit_commands: []
  # Advisories, secret scanning, static analysis. Never expose or rotate secrets.
  security-secret-and-static-analysis:
    mutation: false
    audit_commands: []
  # Backlog and feedback triage. Recommend issues only; mutation is not grantable.
  issue-backlog-and-customer-feedback-triage: {}
