<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-{{NONCE}}'; connect-src 'none'; img-src 'self' data: https://github.com https://user-images.githubusercontent.com https://private-user-images.githubusercontent.com; form-action 'none'; base-uri 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">

<title>Review Round</title>
<style>
/* The Rookery design system (DESIGN.md): Chalk Paper carries data, navy is the
   subject, cobalt is movement, graphite is structure, Dispatch Paper carries
   notes, and orange marks only what needs the operator's intervention. */
:root {
  color-scheme: light;
  --paper: #F6F7FA; --sheet: #FFFFFF; --mist: #E3E9F7; --dispatch: #F0EBE5;
  --hairline: rgb(71 87 122 / 0.32); --hairline-soft: rgb(71 87 122 / 0.16);
  --ink: #042458; --ink-soft: #47577A; --route: #0050CC;
  --signal: #DC6C36; --signal-ink: #963E12;
  --add: #0B5D3B; --add-wash: #EAF3EE; --del: #8F2A1F; --del-wash: #F7E9E6;
  --chosen: #042458; --on-chosen: #F6F7FA;
  --display: Didot, "Bodoni 72", "Bodoni MT", Georgia, serif;
  --serif: Baskerville, "Libre Baskerville", "Baskerville Old Face", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
/* Night paper: the same field manual on a drafting table after dark. Low
   saturation keeps navy from turning into a blue glow and orange scarce. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #14161B; --sheet: #1B1E25; --mist: #242A36; --dispatch: #29251F;
    --hairline: rgb(167 175 192 / 0.30); --hairline-soft: rgb(167 175 192 / 0.15);
    --ink: #ECEEF3; --ink-soft: #A7AFC0; --route: #93AEEF;
    --signal: #E08A5E; --signal-ink: #F0A57E;
    --add: #9BD3B5; --add-wash: #1C2A23; --del: #F0A99D; --del-wash: #33201D;
    --chosen: #ECEEF3; --on-chosen: #14161B;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #14161B; --sheet: #1B1E25; --mist: #242A36; --dispatch: #29251F;
  --hairline: rgb(167 175 192 / 0.30); --hairline-soft: rgb(167 175 192 / 0.15);
  --ink: #ECEEF3; --ink-soft: #A7AFC0; --route: #93AEEF;
  --signal: #E08A5E; --signal-ink: #F0A57E;
  --add: #9BD3B5; --add-wash: #1C2A23; --del: #F0A99D; --del-wash: #33201D;
  --chosen: #ECEEF3; --on-chosen: #14161B;
}
* { box-sizing: border-box; }
html { background: var(--paper); scrollbar-color: var(--ink-soft) var(--paper); }
body { margin: 0; background: var(--paper); font: 16px/1.5 var(--serif); color: var(--ink); font-variant-numeric: lining-nums tabular-nums; }
::selection { background: var(--mist); color: var(--ink); }
h1, h2, h3, p { margin: 0; }
h1 { font: 400 2.6rem/1.08 var(--display); letter-spacing: -0.01em; text-wrap: balance; }
h2 { font: 600 1.2rem/1.3 var(--serif); }
h3 { font: 600 1rem/1.3 var(--serif); }
a { color: var(--route); text-underline-offset: 3px; text-decoration-thickness: 1px; }
button, input, textarea { font: inherit; color: inherit; caret-color: var(--route); }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--route); outline-offset: 2px; }
pre { margin: 6px 0 0; padding: 10px 12px; background: var(--sheet); border: 1px solid var(--hairline); border-radius: 2px; white-space: pre-wrap; overflow-wrap: anywhere; font: 0.8rem/1.55 var(--mono); }
pre span { display: block; padding: 0 4px; }
pre .add { color: var(--add); background: var(--add-wash); }
pre .del { color: var(--del); background: var(--del-wash); }
pre .ctx { color: var(--ink-soft); }

/* Small labels use the compact sans DESIGN.md allows for dense labels. */
.sec-title, .meta, .source, .where, .legend, .cap, .scores small, .vu small, .read .label, .bots b, .part small, .bar-note, .bar-count, .theme, .seg button, .notes, .copy, .over-head small, .crow .where {
  font-family: var(--sans);
}
.meta, .source { color: var(--ink-soft); font-size: 0.82rem; }
.source { margin-top: 6px; }
.empty { color: var(--ink-soft); font-style: italic; }
.sec-title { font-size: 0.72rem; font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 6px; }
.sec-title.spaced { margin-top: 16px; }

/* A seal is the one orange mark: something needs the operator. A ring is its quiet twin. */
.seal, .ring { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; }
.seal { background: var(--signal); }
.ring { border: 1.5px solid var(--ink-soft); }

.bar { position: sticky; top: 0; z-index: 9; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 18px; padding: 12px 28px; background: var(--paper); border-bottom: 1px solid var(--hairline); }
.bar strong { font: 400 1.25rem/1 var(--display); }
.bar-note { color: var(--ink-soft); font-size: 0.8rem; }
.bar-count { margin-left: auto; font-size: 0.82rem; }
.bar-count:empty { display: none; }
.theme { align-self: center; border: 1px solid var(--hairline); background: var(--sheet); color: var(--ink); border-radius: 2px; padding: 4px 12px; font-size: 0.8rem; }
.theme:hover { border-color: var(--ink-soft); }
.bar-count:empty + .theme { margin-left: auto; }
main { max-width: 1280px; margin: 0 auto; padding: 40px 28px 80px; }
.lede { max-width: 70ch; margin-bottom: 30px; }
.lede p { margin-top: 12px; color: var(--ink-soft); font-size: 1.05rem; }
.notices { margin: 14px 0 0; padding: 0; list-style: none; }
.notices li { display: flex; align-items: baseline; gap: 10px; margin-top: 6px; padding: 8px 12px; border: 1px solid var(--hairline); background: var(--sheet); font-size: 0.95rem; }

.over { background: var(--sheet); border: 1px solid var(--hairline); border-radius: 2px; margin-bottom: 16px; }
.over-head { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; padding: 14px 20px 12px; border-bottom: 1px solid var(--hairline); }
.over-head small { font-size: 0.82rem; color: var(--ink-soft); }
.over > .empty { padding: 12px 20px; }
.orow { display: grid; grid-template-columns: 60px minmax(0, 1.25fr) minmax(0, 1.6fr) 200px; gap: 18px; padding: 14px 20px; border-top: 1px solid var(--hairline-soft); align-items: center; }
.over-head + .orow { border-top: 0; }
.vu { display: grid; place-items: center; align-content: center; width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid var(--ink-soft); font: 400 1.55rem/1 var(--display); color: var(--ink-soft); text-align: center; }
.over.hold .vu { border-color: var(--ink); color: var(--ink); }
.vu small { display: block; margin-top: 2px; font-size: 0.55rem; font-weight: 600; letter-spacing: 0.04em; color: var(--ink-soft); }
.orow b { display: block; font-weight: 600; line-height: 1.3; }
.where { display: block; margin-top: 2px; font-size: 0.78rem; color: var(--ink-soft); }
.orow p { font-size: 0.95rem; }
.scores { display: grid; grid-template-columns: repeat(4, 1fr) 1.4fr; gap: 4px; text-align: center; }
.scores span { border: 1px solid var(--hairline-soft); border-radius: 2px; padding: 3px 0 2px; font-weight: 600; font-size: 0.95rem; }
.scores span small { display: block; font-size: 0.58rem; font-weight: 600; letter-spacing: 0.03em; color: var(--ink-soft); }
.scores span.three { background: var(--mist); border-color: var(--ink-soft); font-weight: 700; }
.scores span.lev { border-color: var(--hairline); }
.across { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 30px; font-size: 0.95rem; }
.across span { background: var(--dispatch); border: 1px solid var(--hairline-soft); padding: 8px 12px; }

.block { background: var(--sheet); border: 1px solid var(--hairline); border-radius: 2px; padding: 22px 24px 24px; margin-bottom: 20px; scroll-margin-top: 64px; }
.block-head { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--hairline-soft); }
.block-head h2 { flex: 1 1 320px; display: flex; align-items: center; gap: 12px; }
.block-head .meta { flex: 1 1 100%; order: 3; }
.rank { display: inline-grid; place-items: center; flex: none; width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--ink-soft); font: 400 1rem/1 var(--display); color: var(--ink-soft); }
.block.hold .rank { border-color: var(--ink); color: var(--ink); }
.verdict { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; }
.seg { display: inline-flex; border: 1px solid var(--hairline); border-radius: 2px; background: var(--sheet); }
.seg button { border: 0; background: none; padding: 6px 13px; font-size: 0.82rem; border-right: 1px solid var(--hairline); }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--mist); }
.seg button[aria-pressed="true"] { background: var(--chosen); color: var(--on-chosen); font-weight: 650; }
.notes { width: 260px; max-width: 100%; padding: 6px 10px; border: 1px solid var(--hairline); border-radius: 2px; background: var(--sheet); font-size: 0.82rem; }
.notes::placeholder { color: var(--ink-soft); }
.lenses, .under { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 26px; }
.under { margin-top: 20px; }
.lens-stack { display: grid; gap: 12px; align-content: start; }
.lens { border: 1px solid var(--hairline-soft); background: var(--paper); padding: 10px 14px; font-size: 0.95rem; }
.lens.risk .sec-title { display: flex; align-items: center; gap: 8px; color: var(--signal-ink); }
.lens.risk .sec-title::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--signal); }
.frame-table { border: 1px solid var(--hairline); overflow-x: auto; }
.sit { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
.sit th { text-align: left; font: 600 0.7rem/1.3 var(--sans); letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-soft); padding: 8px 10px; border-bottom: 1px solid var(--hairline); background: var(--paper); }
.sit td { padding: 8px 10px; border-bottom: 1px solid var(--hairline-soft); vertical-align: top; }
.sit tr:last-child td { border-bottom: 0; }
.sit td.now { font-weight: 700; }
.sit td.no { font: 650 0.85rem/1.4 var(--sans); color: var(--signal-ink); white-space: nowrap; }
.sit td.no::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--signal); margin-right: 7px; vertical-align: 1px; }
.sit tr.unsaid td { background: var(--dispatch); }
.sit tr.quiet td { color: var(--ink-soft); }
.screens, .beforeafter { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.screen, .ba { border: 1px solid var(--hairline); padding: 12px; background: var(--paper); font-size: 0.92rem; min-width: 0; }
.screen.after, .ba.after { background: var(--sheet); border-color: var(--ink-soft); }
.cap { font-size: 0.68rem; font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px; }
.screen img { display: block; max-width: 100%; height: auto; border: 1px solid var(--hairline); }
.screen .addr { display: block; margin-top: 6px; font: 0.75rem/1.4 var(--sans); overflow-wrap: anywhere; }
.w-heading { font-weight: 600; margin: 4px 0; }
.w-text { margin: 4px 0; }
.w-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; border: 1px solid var(--hairline-soft); padding: 8px 10px; background: var(--sheet); margin-top: 6px; }
.w-row > span { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.w-btn { display: inline-block; padding: 3px 12px; border-radius: 2px; font: 600 0.78rem/1.6 var(--sans); border: 1px solid var(--route); color: var(--route); }
.w-btn.primary { background: var(--route); color: var(--sheet); }
.w-btn.new { border: 1.5px dashed var(--signal); color: var(--signal-ink); }
.w-badge { display: inline-block; padding: 0 7px; border-radius: 999px; font: 650 0.68rem/1.6 var(--sans); border: 1px solid var(--ink-soft); color: var(--ink-soft); }
.w-input { display: block; border: 1px solid var(--hairline); padding: 4px 8px; color: var(--ink-soft); background: var(--sheet); font: 0.8rem/1.4 var(--sans); margin: 4px 0; }
.w-image { display: grid; place-items: center; height: 56px; border: 1px dashed var(--hairline); color: var(--ink-soft); font: 0.75rem/1.4 var(--sans); margin: 4px 0; }
.changed { outline: 2px solid var(--route); outline-offset: 2px; }
.ba mark { background: none; color: inherit; font-weight: 700; text-decoration: underline 2px var(--route); text-underline-offset: 3px; padding: 0 1px; }
.walk { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px 0; margin-top: 2px; }
.walk div { flex: 1 1 110px; border: 1px solid var(--hairline); padding: 8px 10px; background: var(--paper); font-size: 0.88rem; }
.walk div.on { border: 2px solid var(--route); background: var(--sheet); font-weight: 600; }
.walk i { align-self: center; padding: 0 7px; color: var(--route); font-style: normal; font-family: var(--sans); }
.parts { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 0.9rem; }
.part { border: 1px solid var(--hairline); padding: 7px 12px; background: var(--paper); }
.part.added, .part.changed-part { border-color: var(--route); background: var(--sheet); }
.part.gone { color: var(--ink-soft); }
.part.gone .name { text-decoration: line-through; }
.part small { display: block; font-size: 0.66rem; font-weight: 650; letter-spacing: 0.03em; color: var(--ink-soft); }
.swatches { display: flex; gap: 6px; margin-top: 4px; }
.swatches span { width: 18px; height: 18px; border: 1px solid var(--hairline); }
.read { font-size: 0.95rem; background: var(--dispatch); border: 1px solid var(--hairline-soft); padding: 12px 14px; align-self: start; }
.read p { margin-bottom: 6px; }
.read p:last-child { margin-bottom: 0; }
.read .label { display: inline-block; min-width: 112px; font-size: 0.72rem; font-weight: 650; color: var(--ink-soft); }
.bots { margin-top: 14px; padding: 9px 14px; background: var(--dispatch); border: 1px solid var(--hairline-soft); font-size: 0.95rem; }
.bots b { font-size: 0.72rem; font-weight: 650; color: var(--ink-soft); margin-right: 10px; }
.rest-line { margin-top: 12px; color: var(--ink-soft); font-size: 0.9rem; }
.legend { margin-top: 4px; color: var(--ink-soft); font-size: 0.76rem; }

.closing { background: var(--sheet); border: 1px solid var(--hairline); border-radius: 2px; padding: 18px 22px; margin-bottom: 16px; }
.closing h2 { margin-bottom: 4px; }
.closing h3 { margin: 14px 0 2px; }
.crow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 4px 18px; padding: 8px 0; font-size: 0.95rem; }
.crow + .crow { border-top: 1px solid var(--hairline-soft); }
.crow .where { display: inline; }
.verdicts { scroll-margin-top: 64px; background: var(--sheet); border: 1px solid var(--ink-soft); border-radius: 2px; padding: 16px 20px; margin-top: 26px; }
.verdicts textarea { display: block; width: 100%; min-height: 4.5em; margin-top: 10px; padding: 8px 10px; border: 1px solid var(--hairline); border-radius: 2px; background: var(--paper); font: 0.8rem/1.5 var(--mono); resize: vertical; }
.verdicts-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.copy { border: 1px solid var(--chosen); background: var(--chosen); color: var(--on-chosen); border-radius: 2px; padding: 6px 16px; font-weight: 650; font-size: 0.85rem; }
.copy:hover { opacity: 0.9; }
@media (max-width: 980px) {
  .bar { position: static; padding: 10px 16px; }
  main { padding: 26px 16px 60px; }
  h1 { font-size: 2.1rem; }
  .block { padding: 16px 14px 18px; }
  .orow { grid-template-columns: 56px minmax(0, 1fr); padding: 12px 14px; }
  .orow > p, .orow > .scores { grid-column: 1 / -1; }
  .lenses, .under, .screens, .beforeafter, .crow { grid-template-columns: minmax(0, 1fr); }
  .verdict { margin-left: 0; }
}
</style>
</head>
<body>
<header class="bar"><strong>Review Round</strong><span class="bar-note" id="bar-note"></span><a class="bar-count" id="bar-count" href="#verdicts"></a><button type="button" class="theme" id="theme"></button></header>
<main id="page"><noscript>This page needs JavaScript turned on to show the round.</noscript></main>
<script type="application/json" id="round-data">
{{ROUND_DATA}}
</script>
<script nonce="{{NONCE}}">
"use strict";
(() => {
  const root = document.documentElement;
  const page = document.getElementById("page");

  // Theme: follow the system until the toggle is used; the choice is not stored.
  const themeButton = document.getElementById("theme");
  const media = window.matchMedia("(prefers-color-scheme: dark)");
  const effectiveTheme = () => root.dataset.theme || (media.matches ? "dark" : "light");
  const labelTheme = () => {
    const next = effectiveTheme() === "dark" ? "light" : "dark";
    themeButton.textContent = next === "dark" ? "Dark mode" : "Light mode";
    themeButton.setAttribute("aria-label", "Switch to " + next + " mode");
  };
  themeButton.addEventListener("click", () => {
    root.dataset.theme = effectiveTheme() === "dark" ? "light" : "dark";
    labelTheme();
  });
  media.addEventListener("change", labelTheme);
  labelTheme();

  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  };
  const add = (parent, ...kids) => {
    for (const kid of kids) if (kid) parent.append(kid);
    return parent;
  };
  const str = (value) => (typeof value === "string" ? value.trim() : "");
  const list = (value) => (Array.isArray(value) ? value : []);

  let round;
  try {
    round = JSON.parse(document.getElementById("round-data").textContent);
    if (!round || typeof round !== "object" || Array.isArray(round)) throw new Error("not an object");
  } catch (error) {
    page.replaceChildren(el("p", "notices", "The round's data could not be read, so nothing is shown. Ask the agent to rebuild the page."));
    return;
  }

  const IMAGE_HOSTS = new Set(["github.com", "user-images.githubusercontent.com", "private-user-images.githubusercontent.com"]);
  const DATA_IMAGE = /^data:image\/(png|jpeg|gif|webp);base64,[A-Za-z0-9+/=]+$/;
  const HEX = /^#[0-9a-fA-F]{3,8}$/;
  const httpsUrl = (value) => {
    try {
      const url = new URL(String(value));
      return url.protocol === "https:" ? url : null;
    } catch (error) {
      return null;
    }
  };
  const link = (text, address) => {
    const url = httpsUrl(address);
    if (!url) return el("span", "", text);
    const anchor = el("a", "", text);
    anchor.href = url.href;
    anchor.target = "_blank";
    anchor.rel = "noopener noreferrer";
    return anchor;
  };
  const imageSource = (address) => {
    const value = str(address);
    if (DATA_IMAGE.test(value)) return value;
    const url = httpsUrl(value);
    return url && IMAGE_HOSTS.has(url.hostname) ? url.href : null;
  };

  // Scores and order are computed here so a wrong order cannot be typed.
  const score = (value) => (Number.isInteger(value) && value >= 1 && value <= 3 ? value : null);
  const prs = list(round.prs).filter((pr) => pr && typeof pr === "object").map((pr, index) => {
    const s = pr.scores || {};
    const impact = score(s.impact), confidence = score(s.confidence), verify = score(s.verify), undo = score(s.undo);
    // A missing or invalid score fails safe: the pull request sorts to the top of the held group.
    const product = verify && undo ? verify * undo : 9;
    const leverage = impact && confidence && verify && undo ? (impact * confidence) / (verify * undo) : null;
    return { pr, index, impact, confidence, verify, undo, product, leverage, hold: product >= 3 };
  });
  const byProduct = (a, b) => b.product - a.product || a.index - b.index;
  const over = prs.filter((item) => item.hold).sort(byProduct);
  const under = prs.filter((item) => !item.hold).sort(byProduct);
  const ordered = over.concat(under);
  ordered.forEach((item, position) => { item.rank = position + 1; });

  const shortRepo = (repo) => str(repo).split("/").pop() || str(repo);
  const label = (pr) => shortRepo(pr.repo) + " #" + (pr.number ?? "?");
  const joinNames = (names) => names.length < 2 ? names.join("") : names.slice(0, -1).join(", ") + " and " + names[names.length - 1];

  document.getElementById("bar-note").textContent = [str(round.scope), str(round.generated)].filter(Boolean).join(" · ");

  // Lede
  const lede = el("header", "lede");
  const total = ordered.length;
  let headline;
  if (total === 0) headline = "No open pull requests in this round.";
  else if (over.length === 0) headline = total === 1 ? "The one pull request is under the hold line." : "None of the " + total + " is over the hold line.";
  else if (over.length === total) headline = total === 1 ? "The one pull request is over the hold line." : "All " + total + " are over the hold line.";
  else headline = over.length + " of " + total + (over.length === 1 ? " is" : " are") + " over the hold line.";
  const impactNames = ordered.filter((item) => item.impact === 3).map((item) => label(item.pr));
  const impactText = impactNames.length === 0 ? "None scores 3 on impact."
    : joinNames(impactNames) + (impactNames.length === 1 ? " scores" : " score") + " 3 on impact.";
  add(lede, el("h1", "", headline), el("p", "", "Ranked by verification effort times undo cost, highest first. " + impactText));
  const notices = list(round.notices).map(str).filter(Boolean);
  if (notices.length) {
    const ul = el("ul", "notices");
    for (const notice of notices) {
      const li = el("li");
      add(li, el("span", "seal"), el("span", "", notice));
      ul.append(li);
    }
    lede.append(ul);
  }
  page.replaceChildren(lede);

  // Risk overview
  // A 3 is tinted where it raises the stakes: impact, verification effort, undo cost.
  const scoreCell = (value, name, tint) => {
    const cell = el("span", tint && value === 3 ? "three" : "", value ?? "?");
    cell.append(el("small", "", name));
    return cell;
  };
  const overviewGroup = (items, hold) => {
    const section = el("section", hold ? "over hold" : "over");
    const head = el("div", "over-head");
    add(head, el("span", hold ? "seal" : "ring"), el("h2", "", hold ? "Over the hold line" : "Under the hold line"),
      el("small", "", hold ? "verification effort × undo cost is 3 or more" : "verification effort × undo cost is 2 or less"));
    section.append(head);
    if (!items.length) {
      section.append(el("p", "empty", hold ? "None over the hold line." : "None under the hold line."));
      return section;
    }
    for (const item of items) {
      const row = el("div", "orow");
      const vu = el("div", "vu", item.product);
      vu.append(el("small", "", "V × U"));
      const name = el("div");
      add(name, el("b", "", str(item.pr.title) || "Untitled"), el("span", "where", label(item.pr) + " · " + (str(item.pr.owner) || "No owner")));
      const scores = el("div", "scores");
      const lev = el("span", "lev", item.leverage === null ? "?" : item.leverage.toFixed(2));
      lev.append(el("small", "", "leverage"));
      add(scores, scoreCell(item.impact, "impact", true), scoreCell(item.confidence, "conf.", false),
        scoreCell(item.verify, "verify", true), scoreCell(item.undo, "undo", true), lev);
      add(row, vu, name, el("p", "", str(item.pr.driver)), scores);
      section.append(row);
    }
    return section;
  };
  add(page, overviewGroup(over, true), overviewGroup(under, false));

  const across = list(round.across).filter((note) => note && str(note.text));
  if (across.length) {
    const box = el("div", "across");
    for (const note of across) {
      const span = el("span");
      if (str(note.label)) span.append(el("b", "", str(note.label) + ": "));
      span.append(document.createTextNode(str(note.text)));
      box.append(span);
    }
    page.append(box);
  }

  // Pull request blocks
  const SOURCES = {
    tests: "Taken from the pull request's test or CI output.",
    screenshot: "Taken from a screenshot attached to the pull request.",
    diff: "Worked out by reading the diff, not by running it.",
  };
  const sourceLine = (part, diffText) => {
    const key = Object.hasOwn(SOURCES, part.source) ? part.source : "diff";
    const text = key === "diff" && diffText ? diffText : SOURCES[key];
    return el("p", "source", [text, str(part.sourceNote)].filter(Boolean).join(" "));
  };
  const panel = (title, text, risk) => {
    const box = el("div", risk ? "lens risk" : "lens");
    const body = str(text);
    add(box, el("p", "sec-title", title), el("p", body ? "" : "empty", body || "Nothing to report."));
    return box;
  };

  const situations = (part) => {
    const frag = document.createDocumentFragment();
    const frame = el("div", "frame-table");
    const table = el("table", "sit");
    const head = el("tr");
    for (const name of ["Situation", "Before", "After", "Described?"]) head.append(el("th", "", name));
    table.append(head);
    for (const row of list(part.rows)) {
      const described = str(row.described).toLowerCase();
      const tr = el("tr", described === "unchanged" ? "quiet" : described === "no" ? "unsaid" : "");
      const changed = described !== "unchanged" && str(row.before) !== str(row.after);
      add(tr, el("td", "", str(row.situation)), el("td", "", str(row.before)),
        el("td", changed ? "now" : "", str(row.after)),
        el("td", described === "no" ? "no" : "", described === "yes" ? "Yes" : described === "no" ? "No" : "unchanged"));
      table.append(tr);
    }
    frame.append(table);
    add(frag, frame, sourceLine(part));
    return frag;
  };

  const widget = (item) => {
    if (!item || typeof item !== "object") return null;
    let node;
    switch (item.kind) {
      case "heading": node = el("p", "w-heading", str(item.text)); break;
      case "text": node = el("p", "w-text", str(item.text)); break;
      case "badge": node = el("span", "w-badge", str(item.text)); break;
      case "input": node = el("span", "w-input", str(item.text) || "Input"); break;
      case "image": node = el("div", "w-image", str(item.text) || "Image"); break;
      case "button": {
        const variant = ["primary", "new"].includes(item.variant) ? " " + item.variant : "";
        node = el("span", "w-btn" + variant, str(item.text) || "Button");
        if (item.variant === "new") node.title = "A style the design system does not have";
        break;
      }
      case "row": {
        node = el("div", "w-row");
        const left = el("span"), right = el("span");
        const kids = list(item.items).map(widget).filter(Boolean);
        const split = Number.isInteger(item.split) ? item.split : Math.max(kids.length - 1, 1);
        kids.forEach((kid, i) => (i < split ? left : right).append(kid));
        add(node, left, right);
        break;
      }
      default: return null;
    }
    if (item.changed === true) node.classList.add("changed");
    return node;
  };

  // Each side says what it shows: a screenshot, or a schematic redrawn from the diff.
  const screenSide = (side, caption, after) => {
    const box = el("div", after ? "screen after" : "screen");
    const data = side && typeof side === "object" ? side : {};
    const shot = str(data.image);
    const source = shot ? imageSource(shot) : null;
    box.append(el("p", "cap", caption + (source ? " · screenshot" : " · redrawn")));
    box.dataset.shown = source ? "screenshot" : "redrawn";
    if (source) {
      const img = el("img");
      img.src = source;
      img.alt = caption + " screenshot";
      img.referrerPolicy = "no-referrer";
      box.append(img);
      if (!source.startsWith("data:")) {
        const addr = link(source, source);
        addr.classList.add("addr");
        box.append(addr);
      }
    } else {
      for (const item of list(data.items)) {
        const node = widget(item);
        if (node) box.append(node);
      }
      if (shot) box.append(el("span", "addr", "Screenshot address not shown as an image: " + shot));
    }
    return box;
  };

  const screens = (part) => {
    const frag = document.createDocumentFragment();
    const grid = el("div", "screens");
    const before = screenSide(part.before, "Before", false), after = screenSide(part.after, "After", true);
    add(grid, before, after);
    frag.append(grid);
    const shots = [before, after].filter((side) => side.dataset.shown === "screenshot").length;
    const shownText = shots === 2 ? SOURCES.screenshot
      : shots === 0 ? "Redrawn from the diff, not from a screenshot."
      : "One side is a screenshot attached to the pull request; the other is redrawn from the diff.";
    frag.append(el("p", "source", [shownText, str(part.sourceNote)].filter(Boolean).join(" ")));
    if (grid.querySelector(".w-btn.new, .changed")) {
      frag.append(el("p", "legend", "Blue ring: changed by this pull request. Dashed orange: a style the design system does not have."));
    }
    const steps = list(part.path).filter((step) => step && str(step.step));
    if (steps.length) {
      frag.append(el("p", "sec-title spaced", "Where it sits in the path"));
      const walk = el("div", "walk");
      steps.forEach((step, i) => {
        if (i) walk.append(el("i", "", "→"));
        walk.append(el("div", step.changed === true ? "on" : "", str(step.step)));
      });
      frag.append(walk);
    }
    const parts = list(part.components).filter((c) => c && str(c.name));
    if (parts.length) {
      frag.append(el("p", "sec-title spaced", "Components"));
      const box = el("div", "parts");
      const NAMES = { kept: "Kept", dropped: "No longer used here", added: "New", changed: "Changed" };
      for (const c of parts) {
        const status = Object.hasOwn(NAMES, c.status) ? c.status : "changed";
        const chip = el("div", { added: "part added", changed: "part changed-part", dropped: "part gone" }[status] || "part");
        add(chip, el("small", "", str(c.note) || NAMES[status]), el("span", "name", str(c.name)));
        const colors = list(c.swatches).filter((color) => HEX.test(color));
        if (colors.length) {
          const sw = el("span", "swatches");
          for (const color of colors) {
            const dot = el("span");
            dot.style.backgroundColor = color;
            dot.title = color;
            sw.append(dot);
          }
          chip.append(sw);
        }
        box.append(chip);
      }
      frag.append(box);
    }
    return frag;
  };

  const marked = (text, mark) => {
    const p = el("p");
    const value = str(text), target = str(mark);
    const at = target ? value.indexOf(target) : -1;
    if (at < 0) { p.textContent = value; return p; }
    add(p, document.createTextNode(value.slice(0, at)), el("mark", "", target), document.createTextNode(value.slice(at + target.length)));
    return p;
  };
  const textChange = (part) => {
    const frag = document.createDocumentFragment();
    if (str(part.none)) {
      frag.append(el("p", "", str(part.none)));
    } else {
      const grid = el("div", "beforeafter");
      const before = el("div", "ba"), after = el("div", "ba after");
      add(before, el("p", "cap", "Before"), marked(part.before, part.markBefore));
      add(after, el("p", "cap", "After"), marked(part.after, part.markAfter));
      add(grid, before, after);
      frag.append(grid);
    }
    frag.append(sourceLine(part));
    return frag;
  };

  const choices = new Map();
  const verdictBox = el("textarea");
  const verdictWords = { merge: "merge", changes: "request changes", defer: "defer" };
  const refreshVerdicts = () => {
    const lines = [];
    for (const item of ordered) {
      const choice = choices.get(item);
      if (!choice || !choice.verdict) continue;
      const notes = choice.notes.value.replace(/\s+/g, " ").trim();
      lines.push(str(item.pr.repo) + "#" + item.pr.number + " @ " + str(item.pr.head) + " | " + verdictWords[choice.verdict] + " | " + notes);
    }
    verdictBox.value = lines.join("\n");
    document.getElementById("bar-count").textContent = lines.length
      ? lines.length + (lines.length === 1 ? " Verdict chosen ↓" : " Verdicts chosen ↓") : "";
  };

  const block = (item) => {
    const pr = item.pr;
    const article = el("article", item.hold ? "block hold" : "block");
    article.id = "pr-" + item.rank;
    const head = el("div", "block-head");
    const title = el("h2");
    add(title, el("span", "rank", item.rank), document.createTextNode(str(pr.title) || "Untitled"));
    const size = pr.size || {};
    const meta = el("span", "meta");
    const facts = [label(pr), str(pr.owner) || "No owner",
      "+" + (size.additions ?? "?") + " −" + (size.deletions ?? "?") + (size.files ? " · " + size.files + (size.files === 1 ? " file" : " files") : ""),
      "V × U " + item.product, str(pr.status)].filter(Boolean);
    meta.append(document.createTextNode(facts.join(" · ") + " · "));
    meta.append(link("Open on GitHub", pr.url));
    const verdict = el("div", "verdict");
    const seg = el("div", "seg");
    seg.setAttribute("role", "group");
    seg.setAttribute("aria-label", "Verdict for " + label(pr));
    const notes = el("input", "notes");
    notes.type = "text";
    notes.placeholder = "Notes for the Verdict";
    notes.setAttribute("aria-label", "Notes for " + label(pr));
    const choice = { verdict: null, notes };
    choices.set(item, choice);
    for (const [key, text] of [["merge", "Merge"], ["changes", "Changes"], ["defer", "Defer"]]) {
      const button = el("button", "", text);
      button.type = "button";
      button.setAttribute("aria-pressed", "false");
      button.addEventListener("click", () => {
        choice.verdict = choice.verdict === key ? null : key;
        for (const other of seg.querySelectorAll("button")) other.setAttribute("aria-pressed", String(other === button && choice.verdict === key));
        refreshVerdicts();
      });
      seg.append(button);
    }
    notes.addEventListener("input", refreshVerdicts);
    add(verdict, seg, notes);
    add(head, title, meta, verdict);
    article.append(head);

    const lenses = el("div", "lenses");
    const main = el("div");
    main.append(el("p", "sec-title", "What is different for " + (str(pr.audience) ? "a " + str(pr.audience) : "a user")));
    let shown = false;
    if (pr.situations && list(pr.situations.rows).length) { main.append(situations(pr.situations)); shown = true; }
    if (pr.screens && typeof pr.screens === "object") {
      if (shown) main.append(el("p", "sec-title spaced", "On screen"));
      main.append(screens(pr.screens));
      shown = true;
    }
    if (pr.text && typeof pr.text === "object") { main.append(textChange(pr.text)); shown = true; }
    if (!shown) main.append(el("p", "empty", "Nothing reported."));
    const stack = el("div", "lens-stack");
    add(stack, panel("If it is wrong", pr.ifWrong, item.undo === 3), panel("What proves it", pr.proof), panel("Asked for?", pr.asked));
    add(lenses, main, stack);
    article.append(lenses);

    const under = el("div", "under");
    const codeBox = el("div");
    const code = list(pr.code).filter((c) => c && list(c.lines).length);
    if (!code.length) {
      add(codeBox, el("p", "sec-title", "The code behind it"), el("p", "empty", "Nothing singled out."));
    }
    for (const c of code) {
      codeBox.append(el("p", "sec-title", [str(c.title) || "The code behind it", str(c.file)].filter(Boolean).join(" · ")));
      const pre = el("pre");
      for (const line of list(c.lines)) {
        const text = String(line);
        pre.append(el("span", text.startsWith("+") ? "add" : text.startsWith("-") ? "del" : "ctx", text));
      }
      codeBox.append(pre);
    }
    const read = el("div", "read");
    const r = pr.read || {};
    read.append(el("p", "sec-title", "The agent's read"));
    for (const [key, name] of [["judgment", "Judgment"], ["check", "Check yourself"], ["notExamined", "Not examined"]]) {
      const p = el("p");
      const value = str(r[key]);
      add(p, el("span", "label", name), el("span", value ? "" : "empty", value || "Nothing."));
      read.append(p);
    }
    add(under, codeBox, read);
    article.append(under);

    if (str(pr.feedback)) {
      const bots = el("p", "bots");
      add(bots, el("b", "", "Review feedback"), document.createTextNode(str(pr.feedback)));
      article.append(bots);
    }
    if (str(pr.rest)) article.append(el("p", "rest-line", "Rest of the diff: " + str(pr.rest)));
    return article;
  };
  for (const item of ordered) page.append(block(item));

  // Closing rows
  const closingRow = (row, detail) => {
    const div = el("div", "crow");
    const name = el("div");
    add(name, link(str(row.title) || "Untitled", row.url), el("span", "where", " · " + label(row)));
    add(div, name, el("div", str(row[detail]) ? "" : "empty", str(row[detail]) || "Nothing to add."));
    return div;
  };
  const closingList = (rows, detail, none) => {
    const frag = document.createDocumentFragment();
    const items = list(rows).filter((row) => row && typeof row === "object");
    if (!items.length) frag.append(el("p", "empty", none));
    for (const row of items) frag.append(closingRow(row, detail));
    return frag;
  };
  const progress = el("section", "closing");
  add(progress, el("h2", "", "Still in progress"), closingList(round.inProgress, "note", "None in progress."));
  const merged = round.merged && typeof round.merged === "object" ? round.merged : {};
  const mergedBox = el("section", "closing");
  add(mergedBox, el("h2", "", "Merged since your last review"),
    el("p", "meta", str(merged.window) || "The window was not stated."),
    el("h3", "", "Merged without you"), closingList(merged.without, "reason", "None merged without you."),
    el("h3", "", "Changed after your Verdict"), closingList(merged.changedAfter, "summary", "None changed after your Verdict."));
  add(page, progress, mergedBox);

  // Verdicts to copy
  const box = el("section", "verdicts");
  box.id = "verdicts";
  const boxHead = el("div", "verdicts-head");
  const copy = el("button", "copy", "Copy Verdicts");
  copy.type = "button";
  const status = el("span", "meta", "Choose a Verdict on any pull request, then copy them into the conversation.");
  status.setAttribute("aria-live", "polite");
  copy.addEventListener("click", async () => {
    if (!verdictBox.value) { status.textContent = "No Verdicts chosen yet."; return; }
    try {
      await navigator.clipboard.writeText(verdictBox.value);
      status.textContent = "Copied. Paste them into the conversation.";
    } catch (error) {
      verdictBox.focus();
      verdictBox.select();
      status.textContent = "Copy did not work here. The text is selected; copy it by hand.";
    }
  });
  verdictBox.readOnly = true;
  verdictBox.setAttribute("aria-label", "Chosen Verdicts, one line per pull request");
  add(boxHead, el("h2", "", "Your Verdicts"), copy, status);
  add(box, boxHead, verdictBox);
  page.append(box);
})();
</script>
</body>
</html>
