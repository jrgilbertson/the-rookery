<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>Evaluation review</title>
<style>
:root {
  --page: #F4F6FA;
  --surface: #FFFFFF;
  --rail: #DEE2EC;
  --ink: #042458;
  --muted: #596A8B;
  --accent: #0050CC;
  --accent-hover: #003E9E;
  --intervention: #DC6C36;
  --pass: #2E6B4F;
  --fail: #A3372B;
  --border: rgba(4, 36, 88, .12);
  --border-strong: rgba(4, 36, 88, .22);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --radius: 3px;
  --gutter: 32px;
  color-scheme: light;
  accent-color: var(--accent);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 15px/1.5 var(--font);
  font-variant-numeric: tabular-nums;
  caret-color: var(--accent);
}
::selection { background: rgba(0, 80, 204, .18); color: var(--ink); }
a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { color: var(--accent-hover); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1[tabindex="-1"]:focus { outline: none; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
h1 { font-size: 24px; line-height: 1.25; }
h2 { font-size: 17px; line-height: 1.3; }
h3 { font-size: 15px; line-height: 1.35; }
p { margin: 0; }
code, .mono { font-family: var(--mono); font-size: 13px; }
.muted { color: var(--muted); }
.visually-hidden {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 var(--gutter); }

/* Header */
.top { background: var(--rail); border-bottom: 1px solid var(--border-strong); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 24px; padding-top: 12px; padding-bottom: 12px; font-size: 13px; }
.top .skill { font-weight: 600; font-size: 15px; }
.top .reviewed { margin-left: auto; }
.nav { border-bottom: 1px solid var(--border); background: var(--page); }
.nav .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding-top: 12px; padding-bottom: 12px; }
.nav label { font-size: 13px; color: var(--ink); }
.nav select { flex: 1 1 320px; min-width: 0; width: 100%; max-width: 640px; text-overflow: ellipsis; }
.nav .position { font-size: 13px; color: var(--ink); min-width: 5em; }

/* Controls */
button, select, textarea { font: inherit; color: inherit; }
select, textarea {
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius);
}
select { min-height: 36px; padding: 4px 8px; }
textarea { width: 100%; min-height: 84px; padding: 8px 10px; line-height: 1.5; resize: vertical; }
textarea::placeholder { color: var(--muted); }
button {
  min-height: 36px; padding: 6px 14px; border-radius: var(--radius); cursor: pointer;
  border: 1px solid var(--border-strong); background: var(--surface);
  transition: background-color .15s ease, border-color .15s ease, color .15s ease;
}
button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
button:disabled { cursor: not-allowed; opacity: .55; }
button[aria-busy="true"] { cursor: progress; }

/* Page body */
main { padding-bottom: 64px; }
.state { padding: 48px 0; }
.alert-block { margin-top: 24px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--fail); }
.alert-block h2 { color: var(--fail); font-size: 15px; }
.alert-block ul { margin: 8px 0 0; padding-left: 20px; }
.head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px 24px; padding: 28px 0 20px; border-bottom: 1px solid var(--border-strong); }
.head .titles { flex: 1 1 480px; min-width: 0; }
.head h1 { overflow-wrap: anywhere; }
.head .meta { margin-top: 6px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px; }
.tag {
  display: inline-block; padding: 2px 8px; border: 1px solid var(--border-strong); border-radius: var(--radius);
  font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink); background: var(--surface);
  white-space: nowrap;
}
.tag.pass { color: var(--pass); border-color: var(--pass); }
.tag.fail { color: var(--fail); border-color: var(--fail); }
.tag.warn { color: var(--ink); border-color: var(--intervention); }

section.block { padding: 24px 0; border-bottom: 1px solid var(--border); }
section.block > h2 { margin-bottom: 12px; }
section.block > .lede { margin: -4px 0 16px; font-size: 13px; color: var(--muted); max-width: 75ch; }

/* Definition */
details.disclosure > summary {
  cursor: pointer; font-weight: 600; font-size: 17px; padding: 4px 0; list-style-position: outside;
}
details.disclosure > summary .count { font-weight: 400; font-size: 13px; color: var(--muted); margin-left: 8px; }
details.disclosure[open] > summary { margin-bottom: 12px; }
.fields { display: grid; grid-template-columns: minmax(120px, 180px) minmax(0, 1fr); gap: 12px 24px; margin: 0; }
.fields > dt { font-size: 13px; color: var(--muted); padding-top: 2px; }
.fields > dd { margin: 0; min-width: 0; }
.prose { max-width: 75ch; white-space: pre-wrap; overflow-wrap: anywhere; }
pre.text {
  margin: 0; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border);
  font: 13px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink);
  max-height: 60vh; overflow: auto;
}
pre.text.missing, .missing { color: var(--ink); font-style: italic; }
ol.assertions { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
ol.assertions li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--border); }
ol.assertions li:first-child { border-top: 0; padding-top: 0; }
ol.assertions .aid { color: var(--muted); }
ol.assertions .check { font-size: 12px; color: var(--muted); white-space: nowrap; }

/* Paired results */
.target + .target { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border-strong); }
.target > h3 { font-size: 17px; margin-bottom: 12px; }
.arms { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
@media (min-width: 1100px) { .arms.pair { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.arm { min-width: 0; border-top: 2px solid var(--border-strong); padding-top: 12px; }
.arm.with { border-top-color: var(--accent); }
.arm-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 8px; }
.arm-head h4 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.arm-head .run-id { color: var(--muted); }
.arm .fields { grid-template-columns: minmax(96px, 140px) minmax(0, 1fr); gap: 4px 16px; font-size: 13px; margin-bottom: 12px; }
.arm .fields > dd { color: var(--ink); overflow-wrap: anywhere; }
.arm-note { margin-top: 12px; font-size: 13px; }
.caveat { font-size: 12px; color: var(--muted); margin-top: 2px; }
.gap { margin-top: 8px; padding: 12px 16px; border: 1px dashed var(--border-strong); background: var(--surface); font-size: 13px; }
details.sub { margin-top: 12px; }
details.sub > summary { cursor: pointer; font-size: 13px; font-weight: 600; padding: 6px 0; }
details.sub > summary .count { font-weight: 400; color: var(--muted); margin-left: 6px; }
details.sub[open] > summary { margin-bottom: 6px; }
ul.links { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 13px; }
ul.links a { font-family: var(--mono); overflow-wrap: anywhere; }
ul.links .label { color: var(--muted); margin-left: 8px; font-family: var(--font); }

/* Grades and feedback */
.grades { margin-top: 24px; display: grid; gap: 16px; }
.grade { background: var(--surface); border: 1px solid var(--border); padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 1100px) { .grade { grid-template-columns: minmax(0, 1.25fr) minmax(320px, 1fr); gap: 24px; } }
.grade-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 8px; }
.grade-head .by { font-size: 13px; color: var(--muted); }
.grade .applies { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.grade ol.assertions li { grid-template-columns: minmax(0, 1fr) auto; }
.grade ol.assertions .result { font-size: 12px; font-weight: 600; white-space: nowrap; }
.grade ol.assertions .result.pass { color: var(--pass); }
.grade ol.assertions .result.fail { color: var(--fail); }
.grade ol.assertions .ev { grid-column: 1 / -1; font-size: 13px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }

.feedback { min-width: 0; }
.grade .feedback { border-top: 1px solid var(--border); padding-top: 16px; }
@media (min-width: 1100px) { .grade .feedback { border-top: 0; padding-top: 0; border-left: 1px solid var(--border); padding-left: 24px; } }
.feedback fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.feedback legend { padding: 0; font-weight: 600; font-size: 15px; margin-bottom: 8px; }
.feedback legend code { font-weight: 400; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.choice span {
  display: inline-flex; align-items: center; min-height: 36px; padding: 6px 14px; border-radius: var(--radius);
  border: 1px solid var(--border-strong); background: var(--surface); font-size: 14px; cursor: pointer;
  transition: background-color .15s ease, border-color .15s ease, color .15s ease;
}
.choice input:hover + span { border-color: var(--accent); }
.choice input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; }
.choice input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.choice input:disabled + span { opacity: .55; cursor: not-allowed; }
.feedback .reason { font-size: 13px; color: var(--ink); margin-bottom: 12px; }
.feedback label.note-label { display: block; font-size: 13px; margin-bottom: 4px; }
.feedback .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-top: 8px; }
.feedback .status { font-size: 13px; min-height: 1.5em; }
.feedback .status.error { color: var(--fail); font-weight: 600; }
.feedback .status.saved { color: var(--pass); }
.saved-state { font-size: 13px; margin-bottom: 8px; }
.saved-state .disagree { color: var(--ink); border-bottom: 2px solid var(--intervention); }
.conflict { margin-top: 8px; padding: 8px 12px; border: 1px solid var(--fail); background: var(--surface); font-size: 13px; }
.conflict p + p { margin-top: 4px; }
.conflict .quoted { white-space: pre-wrap; overflow-wrap: anywhere; }

ul.earlier { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 13px; }
ul.earlier li { padding: 8px 0; border-top: 1px solid var(--border); }
ul.earlier li:first-child { border-top: 0; }
ul.earlier .note { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }

/* Trigger observations */
ul.observations { margin: 0; padding: 0; list-style: none; display: grid; gap: 16px; }
ul.observations > li { background: var(--surface); border: 1px solid var(--border); padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 1100px) { ul.observations > li { grid-template-columns: minmax(0, 1.25fr) minmax(320px, 1fr); gap: 24px; } }
ul.observations .fields { grid-template-columns: minmax(120px, 170px) minmax(0, 1fr); gap: 4px 16px; font-size: 13px; }
ul.observations .feedback { border-top: 1px solid var(--border); padding-top: 16px; }
@media (min-width: 1100px) { ul.observations .feedback { border-top: 0; padding-top: 0; border-left: 1px solid var(--border); padding-left: 24px; } }
.obs-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 8px; }

.pager { display: flex; gap: 8px; }

@media (max-width: 1060px) { :root { --gutter: 24px; } }
@media (max-width: 720px) {
  :root { --gutter: 16px; }
  html { scroll-padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
  .top .reviewed { margin-left: 0; }
  .nav .wrap { gap: 8px; }
  .nav select { flex-basis: 100%; max-width: none; }
  .nav .desk-pager, .nav .position { display: none; }
  .fields { grid-template-columns: minmax(0, 1fr); gap: 2px 0; }
  .fields > dd + dt { margin-top: 10px; }
  .arm .fields, ul.observations .fields { grid-template-columns: minmax(0, 1fr); }
  .arm-head { position: sticky; top: 0; background: var(--page); padding: 6px 0; z-index: 1; }
  button, select, .choice span { min-height: 44px; }
  main { padding-bottom: 96px; }
  .bottom-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; align-items: center; gap: 8px;
    padding: 8px var(--gutter) calc(8px + env(safe-area-inset-bottom)); background: var(--rail); border-top: 1px solid var(--border-strong);
  }
  .bottom-bar .position { flex: 1; font-size: 13px; }
}
@media (min-width: 721px) { .bottom-bar { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top" aria-label="Review">
  <div class="wrap" id="top-bar"><span class="skill">Evaluation review</span></div>
</header>
<nav class="nav" aria-label="Cases">
  <div class="wrap">
    <label for="picker">Case or query</label>
    <select id="picker" disabled></select>
    <span class="position" id="position" aria-live="polite"></span>
    <span class="pager desk-pager">
      <button type="button" id="prev" disabled>Previous</button>
      <button type="button" id="next" disabled>Next</button>
    </span>
  </div>
</nav>
<main id="main" tabindex="-1">
  <div class="wrap"><p class="state" id="loading">Loading review…</p></div>
</main>
<div class="bottom-bar" aria-label="Case navigation">
  <button type="button" id="prev-m" disabled>Previous</button>
  <span class="position" id="position-m"></span>
  <button type="button" id="next-m" disabled>Next</button>
</div>
<script>
"use strict";
(function () {
  const ARM_LABEL = { with_skill: "With skill", without_skill: "Without skill" };
  const ARM_ORDER = ["with_skill", "without_skill"];
  const AVAILABILITY = { verified: "Verified", unverified: "Unverified", missing: "Missing" };
  const VERDICT = { pass: "Pass", fail: "Fail", mixed: "Mixed" };
  const RESULT = { pass: "Pass", fail: "Fail", unknown: "Unknown" };
  const OBSERVED = { loaded: "Loaded", not_loaded: "Not loaded", unverified: "Unverified" };
  const EXPECTED = { trigger: "Should load", no_trigger: "Should not load" };
  const BASIS = { native: "Native activation", listing_proxy: "Listing proxy" };

  const state = {
    manifest: null,
    errors: [],
    feedbackError: null,
    bindings: new Map(),
    items: new Map(),
    earlier: [],
    drafts: new Map(),
    status: new Map(),
    conflicts: new Map(),
    saving: new Set(),
    subjects: [],
    index: 0,
  };

  const $ = (id) => document.getElementById(id);

  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v === null || v === undefined || v === false) continue;
        if (k === "class") el.className = v;
        else if (k === "text") el.textContent = v;
        else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
        else if (k === "checked" || k === "disabled" || k === "open") el[k] = true;
        else el.setAttribute(k, v === true ? "" : String(v));
      }
    }
    append(el, children);
    return el;
  }
  function append(el, children) {
    for (const c of children.flat(Infinity)) {
      if (c === null || c === undefined || c === false) continue;
      el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return el;
  }
  const str = (v) => (typeof v === "string" && v.trim() !== "" ? v : null);
  const list = (v) => (Array.isArray(v) ? v : []);
  const word = (map, v, fallback) => (Object.prototype.hasOwnProperty.call(map, v) ? map[v] : fallback);
  const roundId = () => (state.manifest && state.manifest.round && str(state.manifest.round.id)) || null;
  const keyOf = (subjectId, gradeId) => JSON.stringify([subjectId, gradeId ?? null]);
  const bindingKey = (kind, subjectId, recordId) => JSON.stringify([kind, subjectId, recordId]);
  const bindingFor = (kind, subjectId, recordId) => state.bindings.get(bindingKey(kind, subjectId, recordId)) || null;
  function feedbackBinding(subjectId, gradeId) {
    if (gradeId === null) return bindingFor("subject", subjectId, null);
    return bindingFor("grade", subjectId, gradeId) || bindingFor("observation", subjectId, gradeId);
  }
  function displayedFingerprint(subjectId, gradeId) {
    const b = feedbackBinding(subjectId, gradeId);
    return b && b.usable === true ? str(b.fingerprint) : null;
  }
  function textOrMissing(v, missingText) {
    const s = str(v);
    return s === null ? h("span", { class: "missing", text: missingText }) : s;
  }

  function fieldList(rows, cls) {
    const dl = h("dl", { class: "fields" + (cls ? " " + cls : "") });
    for (const row of rows) {
      if (!row) continue;
      dl.appendChild(h("dt", { text: row[0] }));
      dl.appendChild(h("dd", null, row[1], row[2] ? h("div", { class: "caveat", text: row[2] }) : null));
    }
    return dl;
  }

  function evidenceLinks(evidence) {
    const items = list(evidence).filter((e) => e && str(e.id));
    if (items.length === 0) return h("p", { class: "missing", text: "No evidence files listed." });
    return h("ul", { class: "links" }, items.map((e) =>
      h("li", null,
        h("a", { href: "/evidence/" + encodeURIComponent(e.id), target: "_blank", rel: "noopener noreferrer", text: e.id }),
        str(e.label) ? h("span", { class: "label", text: e.label }) : null)));
  }

  function formatDuration(ms) {
    if (typeof ms !== "number" || !isFinite(ms) || ms < 0) return null;
    if (ms < 1000) return Math.round(ms) + " ms";
    const s = ms / 1000;
    if (s < 60) return s.toFixed(1) + " s";
    return Math.floor(s / 60) + " min " + Math.round(s % 60) + " s";
  }
  const fmtInt = (n) => (typeof n === "number" && isFinite(n) && n >= 0 ? Math.round(n).toLocaleString("en-US") : null);
  const MALFORMED = "Malformed record";
  function formatDurationState(ms, st) {
    if (st === "malformed") return [MALFORMED, "The recorded duration could not be read."];
    if (st !== "present") return ["Unknown", null];
    return [formatDuration(ms) ?? "Unknown", null];
  }
  function formatTokens(t, st) {
    if (st === "malformed") return [MALFORMED, "The recorded token counts could not be read."];
    if (st !== "present" || !t || typeof t !== "object") return ["Unknown", null];
    const parts = [["Input", t.input], ["Output", t.output], ["Total", t.total]]
      .map(([label, v]) => label + " " + (fmtInt(v) ?? "unknown"));
    return [parts.join(" · "), null];
  }
  function formatCost(c, st) {
    if (st === "malformed") return [MALFORMED, "The accounting record could not be read. This is not a zero cost."];
    const priced = (st === "api_equivalent_estimate" || st === "subscription_charge") &&
      c && typeof c === "object" && typeof c.usd === "number" && isFinite(c.usd) && c.usd >= 0;
    if (!priced) return ["Unknown", "No priced accounting record for this call. This is not a zero cost."];
    const amount = "$" + c.usd.toFixed(c.usd < 0.01 ? 4 : 2);
    return st === "api_equivalent_estimate"
      ? [amount, "API-equivalent estimate, not a subscription charge."]
      : [amount, "Subscription charge."];
  }
  function formatTime(iso) {
    const d = new Date(iso);
    if (!iso || isNaN(d.getTime())) return "unknown time";
    return d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
  }

  /* ---------- Loading ---------- */

  async function load() {
    const main = $("main");
    let body;
    try {
      const res = await fetch("/api/review", { cache: "no-store", credentials: "same-origin" });
      body = await res.json().catch(() => null);
      if (!res.ok || !body || typeof body !== "object") {
        throw new Error((body && str(body.error)) || "The server returned status " + res.status + ".");
      }
    } catch (err) {
      showFatal("The review could not be loaded",
        [err instanceof TypeError ? "The local review server did not respond. Check that it is still running, then reload this page." : err.message]);
      return;
    }
    state.errors = list(body.errors).filter((e) => e && typeof e === "object");
    if (!body.manifest || typeof body.manifest !== "object") {
      const messages = state.errors.map((e) => (e.id ? e.id + ": " : "") + (str(e.message) || "Unreadable record."));
      showFatal("The review manifest could not be read", messages.length ? messages : ["The server returned no manifest."]);
      return;
    }
    state.manifest = body.manifest;
    const feedback = body.feedback && typeof body.feedback === "object" ? body.feedback : {};
    state.feedbackError = str(feedback.error);
    for (const b of list(body.bindings)) {
      const kind = b && typeof b === "object" ? str(b.record_type) : null;
      if (!kind || !str(b.subject_id)) continue;
      if (kind === "subject") state.bindings.set(bindingKey(kind, b.subject_id, null), b);
      else if (str(b.record_id)) state.bindings.set(bindingKey(kind, b.subject_id, b.record_id), b);
    }
    const round = roundId();
    for (const item of list(feedback.items)) {
      if (!item || typeof item !== "object" || !str(item.subject_id)) continue;
      const shown = displayedFingerprint(item.subject_id, item.grade_id ?? null);

    const found = fromHash ? state.subjects.findIndex((s) => s.kind === fromHash.kind && s.id === fromHash.id) : -1;

  }

  function showFatal(title, messages) {

        h("h2", { text: title }),
        h("ul", null, messages.map((m) => h("li", { text: m }))))));
  }

  function decodeHash() {
    const m = /^#(case|trigger)\/(.+)$/.exec(location.hash);

  /* ---------- Chrome ---------- */

  function subjectTitle(s) {

  function renderChrome() {

  function updatePosition() {

  function renderSubject(moveFocus) {
    const main = $("main");
    const wrap = h("div", { class: "wrap" });

        h("h2", { text: "Saved feedback could not be read" }),

    } else {

  }

  function errorBelongs(e, s) {

    if (s.kind === "case" && e.scope === "grade") return list(s.data.grades).some((g) => g && g.id === e.id);
    if (s.kind === "case" && e.scope === "run") return list(s.data.runs).some((r) => r && r.id === e.id);
    if (s.kind === "trigger" && e.scope === "observation") return list(s.data.observations).some((o) => o && o.id === e.id);

  function subjectErrors(s) {
    const errs = state.errors.filter((e) => errorBelongs(e, s));

  }

  function renderCase(wrap, s) {
    const c = s.data;
    const runs = list(c.runs).filter((r) => r && str(r.id));
    const grades = list(c.grades).filter((g) => g && str(g.id));
    let status = null;
    if (runs.length === 0) status = h("span", { class: "tag", text: "Not run in this round" });

    wrap.appendChild(h("div", { class: "head" },
      h("div", { class: "titles" },
        h("h1", { text: subjectTitle(s) }),
        h("p", { class: "meta" }, h("span", null, "Behavior case ", h("code", { text: c.id })))),
      status));
    const errs = subjectErrors(s);

      feedbackControl(s, null, { legend: "Note on case " + c.id })));

  }

  function renderDefinition(c, open) {
    const assertions = list(c.assertions).filter((a) => a && (str(a.id) || str(a.text)));
    const inputs = list(c.inputs).filter((i) => i && (str(i.label) || str(i.text)));
    const rows = [
      ["Prompt", str(c.prompt) ? h("pre", { class: "text", text: c.prompt }) : h("span", { class: "missing", text: "Missing" })],
      ["Inputs", inputs.length ? h("div", { style: "display:grid;gap:12px" }, inputs.map((i) =>
        h("div", null, h("div", { class: "mono", style: "margin-bottom:4px", text: str(i.label) || "Unlabeled input" }),
          h("pre", { class: "text", text: typeof i.text === "string" ? i.text : "" })))) : h("span", { class: "muted", text: "None" })],
      ["Expected outcome", str(c.expected) ? h("p", { class: "prose", text: c.expected }) : h("span", { class: "missing", text: "Not stated" })],
      ["Assertions", assertions.length ? h("ol", { class: "assertions" }, assertions.map((a) =>
        h("li", null,
          h("code", { class: "aid", text: str(a.id) || "—" }),
          h("span", { class: "prose", text: str(a.text) || "" }),
          h("span", { class: "check", text: a.check === "deterministic" ? "Deterministic check" : a.check === "judgment" ? "Judgment" : "Check type unknown" })))) :

  function renderResults(s, runs, grades) {
    const c = s.data;
    const section = h("section", { class: "block", "aria-labelledby": "results-h" },
      h("h2", { id: "results-h", text: "Results" }),

    const targets = [];

        block.appendChild(h("p", { class: "gap" },
          "No " + missingArms.map((a) => ARM_LABEL[a].toLowerCase()).join(" or ") + " run is recorded for this target, so this is not a complete comparison."));
      }

        if (placed.has(g.id)) return false;

      });

  }
  const armRank = (arm) => { const i = ARM_ORDER.indexOf(arm); return i < 0 ? ARM_ORDER.length : i; };

  function renderArm(s, r) {
    const b = bindingFor("run", s.id, r.id) || {};
    const label = word(ARM_LABEL, r.arm, "Unknown arm");
    const [cost, costCaveat] = formatCost(r.cost, b.cost_state);
    const [duration, durationCaveat] = formatDurationState(r.duration_ms, b.duration_state);
    const [tokens, tokensCaveat] = formatTokens(r.tokens, b.tokens_state);

        h("p", { class: "prose", style: "font-size:13px", text: r.summary })) : null,
      h("details", { class: "sub" },
        h("summary", null, "Native evidence", h("span", { class: "count", text: String(list(r.evidence).length) })),
        evidenceLinks(r.evidence)));
  }

  function renderGrades(s, grades, c, runById, emptyText) {
    if (!grades.length) return emptyText ? h("p", { class: "gap", text: emptyText }) : h("div");
    const assertionText = new Map(list(c.assertions).filter((a) => a && str(a.id)).map((a) => [a.id, a.text]));
    return h("div", { class: "grades" }, grades.map((g) => {
      const b = bindingFor("grade", s.id, g.id) || {};

          caveats.map((t) => h("p", { class: "gap", style: "margin:0 0 12px", text: t })),
          str(g.summary) ? h("p", { class: "prose", style: "margin-bottom:12px", text: g.summary }) : null,
          rows.length ? h("ol", { class: "assertions" }, rows.map((a) => {
            const res = word(RESULT, a.result, "Unknown");
            return h("li", null,
              h("span", null, h("code", { class: "aid", text: (str(a.assertion_id) || "—") + " " }), str(assertionText.get(a.assertion_id)) || ""),

              h("span", { class: "ev", text: str(a.evidence) ? a.evidence : "No supporting evidence recorded." }));
          })) : h("p", { class: "missing", text: "No per-assertion results recorded." }),
          h("details", { class: "sub" },
            h("summary", null, "Grading evidence", h("span", { class: "count", text: String(list(g.evidence).length) })),
            evidenceLinks(g.evidence))),
        feedbackControl(s, g.id, { legend: "Your judgment of grade ", legendCode: g.id, record: "grade" }));
    }));
  }

  function renderTrigger(wrap, s) {
    const t = s.data;

    wrap.appendChild(h("div", { class: "head" },

    if (!obs.length) {

      h("p", { class: "lede", text: "A note about the query itself, such as its wording or expectation. It is not a judgment of any observation." }),
      feedbackControl(s, null, { legend: "Note on query " + t.id })));

  const SELECTION = {
    training: ["Training", null],
    validation: ["Validation", "Not used for selection."],
    validation_used_for_selection: ["Validation, used for selection", "Used to choose the description, so it is not untouched final evidence."],
    fresh: ["Fresh", "Not used for tuning or selection."],
    fresh_marked_used_for_selection: ["Fresh, but marked used for selection", "Marked as used for selection, so it is not untouched final evidence."],
  };
  const PROOF = {
    verified_trigger: "Verified: loaded",
    verified_non_trigger: "Verified: not loaded",
    unverified: "Unverified",
  };

  function renderObservation(s, t, o) {
    const b = bindingFor("observation", s.id, o.id) || {};
    const [role, roleCaveat] = word(SELECTION, b.selection, ["Role unknown", null]);
    const proof = word(PROOF, b.proof, "Unverified");
    const native = b.basis === "native";
    const recorded = word(OBSERVED, b.observed ?? o.observed, "Unknown");
    let match;
    if (b.proof !== "verified_trigger" && b.proof !== "verified_non_trigger") match = "Cannot compare: no native activation proof";
    else if (t.expected !== "trigger" && t.expected !== "no_trigger") match = "Cannot compare: expectation unknown";
    else match = (b.proof === "verified_trigger") === (t.expected === "trigger") ? "Matches expectation" : "Does not match expectation";
    return h("li", { "aria-label": "Observation " + o.id },
      h("div", null,
        h("div", { class: "obs-head" },
          h("h3", null, "Observation ", h("code", { text: o.id })),
          h("span", { class: match === "Does not match expectation" ? "tag fail" : match === "Matches expectation" ? "tag pass" : "tag", text: match })),
        fieldList([
          ["Target", textOrMissing(b.target ?? o.target, "Unknown")],
          ["Description revision", str(b.description_revision ?? o.description_revision) ? h("code", { text: b.description_revision ?? o.description_revision }) : h("span", { class: "missing", text: "Unknown" })],
          ["Role", role, roleCaveat],
          ["Expected", word(EXPECTED, t.expected, "Unknown")],
          ["Activation", proof, b.proof === "unverified" || !b.proof ? "Recorded observation: " + recorded + ". Not counted as an activation result." : null],
          ["Evidence type", word(BASIS, b.basis, "Unknown"), native ? null : "Not proof of native activation."],
        ]),
        str(o.summary) ? h("p", { class: "prose", style: "margin-top:12px;font-size:13px", text: o.summary }) : null,
        h("details", { class: "sub" },
          h("summary", null, "Native evidence", h("span", { class: "count", text: String(list(o.evidence).length) })),
          evidenceLinks(o.evidence))),
      feedbackControl(s, o.id, { legend: "Your judgment of observation ", legendCode: o.id, record: "observation" }));
  }

  function renderEarlier(s) {

      h("h2", { id: "earlier-h", text: "Earlier feedback" }),
      h("p", { class: "lede", text: "Saved against a different round or against content that has since changed. Shown for reference; it does not carry over." }),
      h("ul", { class: "earlier" }, older.map((item) => h("li", null,
        h("div", null,
          "Round ", h("code", { text: str(item.round_id) || "unknown" }),
          item.grade_id ? [", ", s.kind === "case" ? "grade " : "observation ", h("code", { text: item.grade_id })] : ", note only",
          ": ", judgmentWord(item.judgment),
          h("span", { class: "muted", text: " · saved " + formatTime(item.saved_at) })),
        str(item.note) ? h("div", { class: "note", text: item.note }) : null))));
  }

  /* ---------- Feedback ---------- */

  function judgmentWord(j) {
    return j === "agree" ? "Agreed" : j === "disagree" ? "Disagreed" : "No judgment";
  }
  function savedOf(key) {
    const item = state.items.get(key);
    return item ? { judgment: item.judgment ?? null, note: typeof item.note === "string" ? item.note : "" } : { judgment: null, note: "" };
  }
  function draftOf(key) { return state.drafts.get(key) || savedOf(key); }
  function isDirty(key) {
    const d = state.drafts.get(key);
    if (!d) return false;
    const s = savedOf(key);
    return d.judgment !== s.judgment || d.note !== s.note;
  }
  function unsavedCount() { let n = 0; for (const k of state.drafts.keys()) if (isDirty(k)) n++; return n; }

  let uid = 0;
  function feedbackControl(s, gradeId, opts) {
    const key = keyOf(s.id, gradeId);
    const round = roundId();
    const judged = gradeId !== null;
    const what = !judged ? "note" : opts.record === "observation" ? "observation" : "grade";
    const fingerprint = displayedFingerprint(s.id, gradeId);
    let blocked = null;
    if (!round) blocked = "Feedback cannot be saved: the manifest has no round identifier.";
    else if (state.feedbackError) blocked = "Feedback cannot be saved until the feedback file can be read.";
    else if (!fingerprint) blocked = "Feedback cannot be saved: the server did not identify the version of this " + what + " shown here. Reload the page; any text you type stays here until then.";
    const id = "fb" + (++uid);
    const draft = draftOf(key);
    const container = h("div", { class: "feedback" });
    const savedLine = h("p", { class: "saved-state" });
    const status = h("p", { class: "status", id: id + "-status", "aria-live": "polite" });
    const conflictBox = h("div");
    const note = h("textarea", { id: id + "-note", "aria-describedby": id + "-status",
      placeholder: judged ? "Why you agree or disagree, or what the " + what + " missed" : "Optional note" });
    note.value = draft.note;
    const save = h("button", { type: "button", class: "primary", text: "Save feedback" });
    const radios = [];

    const fs = h("fieldset", null,
      h("legend", null, opts.legend, opts.legendCode ? h("code", { text: opts.legendCode }) : null));
    if (blocked) fs.appendChild(h("p", { class: "reason", text: blocked }));
    if (judged) {
      const choices = h("div", { class: "choices", role: "radiogroup", "aria-label": "Judgment of " + what + " " + gradeId });
      for (const [value, label] of [["", "No judgment"], ["agree", "Agree"], ["disagree", "Disagree"]]) {
        const input = h("input", { type: "radio", name: id + "-j", value, checked: (draft.judgment || "") === value });
        input.addEventListener("change", () => { if (input.checked) edit(); });
        radios.push(input);
        choices.appendChild(h("label", { class: "choice" }, input, h("span", { text: label })));
      }
      fs.appendChild(choices);
    }
    fs.appendChild(h("label", { class: "note-label", for: id + "-note", text: "Note" }));
    fs.appendChild(note);
    fs.appendChild(h("div", { class: "actions" }, save, status));
    fs.appendChild(conflictBox);
    container.appendChild(savedLine);
    container.appendChild(fs);

    note.addEventListener("input", edit);
    save.addEventListener("click", () => submit());

    function currentDraft() {
      const checked = radios.find((r) => r.checked);
      return { judgment: judged && checked && checked.value ? checked.value : null, note: note.value };
    }
    function edit() {
      state.drafts.set(key, currentDraft());
      if (!state.saving.has(key) && state.status.get(key)?.kind !== "error") state.status.delete(key);
      paint();
    }
    function paint() {
      const item = state.items.get(key);
      savedLine.replaceChildren();
      if (item) {
        const when = h("span", { class: "muted", text: " · " + formatTime(item.saved_at) });
        if (judged) {
          savedLine.append("Saved: ",
            item.judgment === "disagree" ? h("span", { class: "disagree", text: "Disagreed" }) : judgmentWord(item.judgment),
            str(item.note) ? " with a note" : "", when);
        } else {
          savedLine.append(str(item.note) ? "Note saved" : "Saved with an empty note", when);
        }
      } else {
        savedLine.append(h("span", { class: "muted", text: judged ? "No feedback saved for this " + what + " yet." : "No note saved yet." }));
      }
      const busy = state.saving.has(key);
      const dirty = isDirty(key);
      const conflict = state.conflicts.get(key);
      const retired = conflict === null;
      const locked = Boolean(blocked) || retired;
      for (const r of radios) r.disabled = locked;
      note.readOnly = Boolean(blocked);
      save.disabled = locked || busy || !dirty;
      save.setAttribute("aria-busy", busy ? "true" : "false");
      save.textContent = busy ? "Saving…" : conflict ? "Save my draft over it" : "Save feedback";
      const st = state.status.get(key);
      status.className = "status" + (st ? " " + st.kind : "");
      status.removeAttribute("role");
      if (busy) status.textContent = "Saving…";
      else if (st) { status.textContent = st.text; if (st.kind === "error") status.setAttribute("role", "alert"); }
      else status.textContent = dirty ? "Unsaved changes" : "";
      conflictBox.replaceChildren();
      if (conflict) {
        conflictBox.appendChild(h("div", { class: "conflict" },
          h("p", null, "Newer feedback was saved elsewhere at " + formatTime(conflict.saved_at) + ": " + judgmentWord(conflict.judgment) + "."),
          str(conflict.note) ? h("p", { class: "quoted", text: "Its note: " + conflict.note }) : h("p", { text: "It has no note." }),
          h("p", { text: "Your draft above is unchanged and was not saved. Save again to replace the newer version, or edit your draft first." })));
      } else if (retired) {
        conflictBox.appendChild(h("div", { class: "conflict" },
          h("p", { text: "This record changed after the page loaded, so feedback on the version shown here can no longer be saved." }),
          h("p", { text: "Copy your draft if you need it, then reload the page to review the current version." })));
      }
    }

    async function submit() {
      const d = currentDraft();
      state.drafts.set(key, d);
      const base = state.items.get(key);
      const payload = {
        round_id: round, subject_id: s.id, grade_id: gradeId, fingerprint,
        judgment: d.judgment, note: d.note,
        base_revision: base && Number.isInteger(base.revision) ? base.revision : 0,
      };
      state.saving.add(key);
      state.status.delete(key);
      paint();
      let res = null, body = null;
      try {
        res = await fetch("/api/feedback", {
          method: "POST", credentials: "same-origin", cache: "no-store",
          headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
        });
        body = await res.json().catch(() => null);
      } catch (_) {
        res = null;
      }
      state.saving.delete(key);
      const matches = (item) => item && typeof item === "object" && item.binding === "current" &&
        item.round_id === round && item.subject_id === s.id && (item.grade_id ?? null) === gradeId &&
        item.fingerprint === fingerprint && Number.isInteger(item.revision);
      const reason = (fallback) => {
        const text = (body && str(body.error)) || fallback;
        return /^not saved/i.test(text) ? text : "Not saved: " + text;
      };
      if (!res) {
        state.status.set(key, { kind: "error", text: "Not saved: the local review server did not respond. Your draft is kept; try Save again." });
      } else if (res.status === 409) {
        const item = body && body.item;
        if (matches(item)) {
          state.items.set(key, item);
          state.conflicts.set(key, item);
        } else {
          state.conflicts.set(key, null);
        }
        state.status.set(key, { kind: "error", text: reason("newer feedback exists for this item.") });
      } else if (!res.ok) {
        state.status.set(key, { kind: "error", text: reason("the server returned status " + res.status + ".") + " Your draft is kept." });
      } else {
        const item = body && body.item;
        if (item && typeof item === "object" && str(item.fingerprint) && item.fingerprint !== fingerprint) {
          state.conflicts.set(key, null);
          state.status.set(key, { kind: "error", text: "Not confirmed: the server recorded this against a changed version of the record, not the version shown. Reload and review it before relying on this feedback." });
        } else if (!matches(item) || (item.judgment ?? null) !== d.judgment || item.note !== d.note) {
          state.status.set(key, { kind: "error", text: "Not saved: the server response did not confirm this feedback. Reload to check what was stored." });
        } else {
          state.items.set(key, item);
          state.conflicts.delete(key);
          const current = currentDraft();
          if (current.judgment === d.judgment && current.note === d.note) state.drafts.delete(key);
          state.status.set(key, { kind: "saved", text: "Saved " + formatTime(item.saved_at) });
          refreshCounts();
        }
      }
      if (container.isConnected) paint();
    }

    paint();
    return container;
  }

  function refreshCounts() {
    const reviewed = state.subjects.filter(hasFeedback).length;
    const el = $("reviewed-count");
    if (el) el.textContent = reviewed + " of " + state.subjects.length + " have feedback";
    const picker = $("picker");
    state.subjects.forEach((s, i) => {
      const opt = picker.querySelector('option[value="' + i + '"]');
      if (opt) opt.textContent = subjectTitle(s) + (hasFeedback(s) ? " — has feedback" : "");
    });
  }

  load();
})();
</script>
</body>
</html>
